# squadra-server behind Caddy (HTTPS) on your own domain.
#
#   cp .env.example .env      # set SQUADRA_DOMAIN
#   docker compose up -d
#   docker compose logs squadra-server   # the first time: the server token and the /squadra:configure command
#   (later: docker compose exec squadra-server cat /data/server-token /data/join-token)
#
# Only Caddy publishes ports; squadra-server is reachable only through it.

services:
  squadra-server:
    build:
      context: ..
      dockerfile: server/Dockerfile
    restart: unless-stopped
    environment:
      PUBLIC_URL: https://${SQUADRA_DOMAIN:?set SQUADRA_DOMAIN in .env}
      # Caddy sets X-Forwarded-For: rate limits then see each client's address.
      TRUST_PROXY: "1"
    volumes:
      - squadra-data:/data

  caddy:
    # (Fixed by digest, here and in the Dockerfiles: to update, change both the tag and the digest.)
    image: caddy:2.8.4@sha256:226d1f059b75399fe19182893c7184591c07b97afc8dfcf44eeb80c9a77a530f
    restart: unless-stopped
    depends_on:
      - squadra-server
    environment:
      SQUADRA_DOMAIN: ${SQUADRA_DOMAIN:?set SQUADRA_DOMAIN in .env}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  squadra-data:
  caddy-data:
  caddy-config:
