# Squadra demo: the dashboard and one machine that runs Claude Code, in a
# single container. Everything it keeps is in ./squadra, next to this file.
#
#   cd deploy/demo
#   docker-compose up -d              # or: docker compose up -d
#   cat squadra/data/server-token     # the sign-in token (also in: docker-compose logs)
#
# Then open http://localhost:7787. Only this computer can reach it.
services:
  squadra-demo:
    build:
      context: ../..
      dockerfile: deploy/demo/Dockerfile
    image: squadra-demo
    restart: unless-stopped
    ports:
      - "127.0.0.1:7787:7787"
    volumes:
      - ./squadra:/squadra
