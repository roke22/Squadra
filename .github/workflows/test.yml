# End-to-end tests on the supported systems: Linux and macOS.
# (Windows is supported through WSL, which is Linux.)
name: test

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install tmux (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tmux
      - name: Install tmux (macOS)
        if: runner.os == 'macOS'
        run: brew install tmux
      - run: npm test

  # A release must be signed: a machine won't install one that isn't. (Only for
  # a release: between them, squadra-host can change without being signed yet.)
  release:
    if: github.ref_type == 'tag' || startsWith(github.head_ref, 'release-')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - if: github.ref_type == 'tag'
        run: node scripts/release.mjs check "$GITHUB_REF_NAME"
      - if: github.ref_type != 'tag'
        run: node scripts/release.mjs check
