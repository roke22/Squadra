      closeMenu()
      if (b.dataset.go) location.hash = b.dataset.go
      else if (b.dataset.act === 'reopen') reopen(name)
      else runAction(b.dataset.act, name)
    })
  }

  function confirmDialog({ title, text, confirm, danger = false, run }) {
    const bg = document.createElement('div')
    bg.className = 'modal-bg'
    bg.innerHTML = `<div class="modal" role="dialog" aria-modal="true"><h3>${esc(title)}</h3><p>${text}</p><div class="err"></div>
      <div class="actions"><button class="btn" data-cancel>${T.cancel}</button><button class="btn primary ${danger ? 'danger' : ''}" data-ok>${esc(confirm)}</button></div></div>`
    document.body.appendChild(bg)
    const close = () => bg.remove()
    bg.addEventListener('click', e => { if (e.target === bg) close() })
    bg.querySelector('[data-cancel]').addEventListener('click', close)
    const ok = bg.querySelector('[data-ok]')
    ;(danger ? bg.querySelector('[data-cancel]') : ok).focus() // Enter never confirms something destructive
    ok.addEventListener('click', async () => {
      ok.disabled = true
      try { await run(); close() } catch (err) {
        bg.querySelector('.err').textContent = err.message
        ok.disabled = false
      }
    })
  }

  async function post(action, session) {
    const r = await fetch(`/api/${action}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
      body: JSON.stringify({ session }),
    })
    if (r.status === 401) { showLogin(T.tokenInvalid); throw new Error(T.unauthorized) }
    const j = await r.json()
    if (!j.ok) throw new Error(j.parameters?.reason === 'session_online' ? T.sessionOnline : j.description)
    return j.result
  }

  function runAction(action, name) {
    if (action === 'addworker') return addWorkerTo(name)
    const s = sessions.get(name)
    const who = `<b>${esc(name)}</b>`
    if (action === 'kick') {
      return confirmDialog({ title: T.kickTitle(name), text: T.kickText(who), confirm: T.kick, danger: true, run: () => post('kick', name) })
    }
    if (action === 'clear') {
      return confirmDialog({
        title: T.clearTitle(name),
        text: T.clearText(who, s?.online),
        confirm: T.clearChat,
        danger: true,
        run: () => post('clear', name),
      })
    }
    if (action === 'archive') {
      return confirmDialog({
        title: T.archiveTitle(name),
        text: T.archiveText(who),
        confirm: T.archive,
        run: () => post('archive', name),
      })
    }
    if (action === 'unarchive') return post('unarchive', name).catch(err => alertBox(err.message))
    if (action === 'delete') {
      return confirmDialog({
        title: T.deleteTitle(name),
        text: T.deleteText(who, esc(name)),
        confirm: T.delete,
        danger: true,
        run: async () => {
          await post('delete', name)
          if (currentRoute().name === name) location.hash = s?.archived_at ? '#/archived' : '#/'
        },
      })
    }
  }

  function alertBox(text) {
    confirmDialog({ title: T.couldNotComplete, text: esc(text), confirm: T.ok, run: async () => {} })
  }

  // ---------------------------------------------------------------------------
  // archived view
  function renderArchived() {
    const list = sortedSessions({ archived: true })
    $('archived').innerHTML = `<div class="arch-list">${list.length ? list.map(s => `
      <div class="arch ${s.role ?? ''}">
        <div class="info">
          <div class="n"><span class="dot ${status(s).dot}"></span>${esc(s.name)} ${roleTag(s.role)}</div>
          <div class="m">${T.archivedAt(new Date(s.archived_at).toLocaleString(LOCALE))} · ${esc(status(s).text)}${s.activity?.cwd ? ` · ${esc(s.activity.cwd)}` : ''}</div>
        </div>
        <div class="acts">
          <button class="btn" data-go="#/s/${encodeURIComponent(s.name)}">${T.viewChat}</button>
          <button class="btn" data-act="unarchive" data-s="${esc(s.name)}">${T.unarchive}</button>
          <button class="btn danger" data-act="delete" data-s="${esc(s.name)}" ${s.online ? 'disabled' : ''}>${T.delete}</button>
        </div>
      </div>`).join('') : `<div class="mosaic-empty">${T.noArchived}</div>`}</div>`
  }

  $('archived').addEventListener('click', e => {
    const go = e.target.closest('[data-go]')
    if (go) location.hash = go.dataset.go
    const act = e.target.closest('[data-act]')
    if (act && !act.disabled) runAction(act.dataset.act, act.dataset.s)
  })

  function clearMosaic() {
    for (const p of mosaicPanes.values()) p.view.destroy()
    mosaicPanes.clear()
    mosaicKey = null
    $('mosaic').innerHTML = ''
  }

  // A worker's state in a coordinator's team: what it is doing, and for how long.
  function workerState(w) {
    const a = w.activity ?? {}
    if (!w.online) return { k: 'offline', dot: '', text: T.wOffline }
    if (a.state === 'waiting') return { k: 'waiting', dot: 'err pulse', text: T.wWaiting }
    if (a.state === 'compacting') return { k: 'working', dot: 'info pulse', text: T.compacting }
    if (a.state === 'tool' || a.state === 'working') return { k: 'working', dot: 'ok pulse', text: T.wWorking(dur(now() - ((a.state === 'tool' ? a.tool?.since : a.since) ?? now()))), since: a.since }
    return { k: 'idle', dot: 'ok', text: T.wIdle(a.since ? dur(now() - a.since) : '—'), since: a.since ?? now() }
  }
  // A coordinator's team: who waits for a permission, who is idle (longest
  // first: ready for more work), who works, who is gone.
  function teamStrip(c) {
    const ws = sortedSessions().filter(s => s.role !== 'coordinator' && s.coordinator === c.name).map(w => ({ w, st: workerState(w) }))
    const rank = { waiting: 0, idle: 1, working: 2, offline: 3 }
    ws.sort((a, b) => (rank[a.st.k] - rank[b.st.k]) || ((a.st.since ?? 0) - (b.st.since ?? 0)) || COLLATOR.compare(a.w.name, b.w.name))
    const n = k => ws.filter(x => x.st.k === k).length
    const chips = ws.map(({ w, st }) => `<span class="wchip ${st.k}"><button class="wname" data-go="#/s/${encodeURIComponent(w.name)}"><span class="dot ${st.dot}"></span>${esc(w.name)}</button><span class="wst">${esc(st.text)}</span>${st.k === 'idle' ? `<button class="give" data-givework="${esc(c.name)}" title="${esc(T.giveWorkTitle(w.name, c.name))}">${T.giveWork}</button>` : ''}</span>`).join('')
    return `<div class="team-sum">${ws.length ? esc(T.teamSummary(ws.length, n('working'), n('idle'), n('waiting'))) : T.noWorkers}</div>
      <div class="team-list">${chips}<button class="btn addw" data-addworker="${esc(c.name)}" title="${esc(T.addWorkerTo(c.name))}">${T.addWorker}</button></div>`
  }
  function refreshLeads() {
    if (currentRoute().view !== 'leads') return
    for (const [name, p] of mosaicPanes) { const s = sessions.get(name); const el = p.pane.querySelector('.team'); if (s && el) setHtml(el, teamStrip(s)) }
  }
  // "Give work": straight to the coordinator's terminal, ready to type (nothing typed for you).
  function giveWork(coord) {
    const p = mosaicPanes.get(coord)
    if (p?.kind === 'term' && p.view.x) { p.pane.scrollIntoView?.({ block: 'nearest' }); p.view.x.focus() }
    else location.hash = `#/s/${encodeURIComponent(coord)}`
  }

  function route() {
    const r = currentRoute()
    closeMenu()
    // Going to a worker unfolds its squad in the sidebar, so it shows where you are.
    const c = r.view === 'session' && sessions.get(r.name)?.role === 'worker' ? sessions.get(r.name).coordinator : null
    if (c && squadOpen[c] !== true) { squadOpen[c] = true; store.set('squadraSquads', JSON.stringify(squadOpen)) }
    $('archived').hidden = r.view !== 'archived'
    $('hosts').hidden = r.view !== 'hosts'
    const st = sessionTerm(r)
    const termMode = r.view === 'terminal' || !!st
    $('terminal').hidden = !termMode
    if (!termMode && termView) { termView.destroy(); termView = null; $('terminal').innerHTML = '' }
    if (r.view === 'hosts' || r.view === 'terminal') {
      if (sessionView) { sessionView.destroy(); sessionView = null; $('session').innerHTML = '' }
      clearMosaic()
      $('session').hidden = true
      $('mosaic').hidden = true
      if (r.view === 'hosts') renderHosts(r.host)
      else if (!termView || termView.host !== r.host || termView.term !== r.term) {
        termView?.destroy()
        termView = new TermView(r.host, r.term, $('terminal'))
      }
    } else if (r.view === 'mosaic' || r.view === 'leads') {
      if (sessionView) { sessionView.destroy(); sessionView = null; $('session').innerHTML = '' }
      $('session').hidden = true
      $('mosaic').hidden = false
      buildMosaic()
    } else if (r.view === 'archived') {
      if (sessionView) { sessionView.destroy(); sessionView = null; $('session').innerHTML = '' }
      clearMosaic()
      $('session').hidden = true
      $('mosaic').hidden = true
      renderArchived()
    } else if (st) {
      // The session's live terminal, as in Machines: watch it and type to it.
      if (sessionView) { sessionView.destroy(); sessionView = null; $('session').innerHTML = '' }
      clearMosaic()
      $('mosaic').hidden = true
      $('session').hidden = true
      if (!termView || termView.host !== st.host.id || termView.term !== r.name) {
        termView?.destroy()
        termView = new TermView(st.host.id, r.name, $('terminal'))
      }
      unread.delete(r.name)
    } else {
      clearMosaic()
      $('mosaic').hidden = true
      $('session').hidden = false
      if (!sessionView || sessionView.name !== r.name) {
        sessionView?.destroy()
        sessionView = new ChatView(r.name, { full: true })
        $('session').innerHTML = ''
        $('session').appendChild(sessionView.el)
      }
      unread.delete(r.name)
    }
    renderTop()
    renderNav()
  }
  // (Only while signed in: a link opened on the login page doesn't load views, or ask the server with no token.)
  window.addEventListener('hashchange', () => { if (token && !$('app').hidden) route() })

  // ---------------------------------------------------------------------------
  // machines (squadra-host): list, add, rename, disconnect, open and close sessions
  const hostListeners = new Set()

  // The machine where a session runs, if it was opened from here.
  // Only on the machine the server opened it on (host_id): another machine
  // claiming a session with the same name never gets its terminal button.
  function terminalOf(name) {
    const owner = sessions.get(name)?.host_id
    if (!owner) return null
    const h = hosts.get(owner)
    const t = h?.online && h.info?.terminals?.find(x => x.id === name)
    return t ? { host: h, term: t } : null
  }

  async function postJson(path, body) {
    const r = await fetch(path, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
      body: JSON.stringify(body),
    })
    if (r.status === 401) { showLogin(T.tokenInvalid); throw new Error(T.unauthorized) }
    const j = await r.json()
    if (!j.ok) {
      const why = j.description.replace(/^(Bad Request|Conflict|Forbidden): /, '')
      // (A machine's own words are said to be its own, never the dashboard's.)
      const r = j.parameters?.reason
      throw new Error(r === 'name_in_use' ? T.nameTaken(body?.spec?.name ?? '') : r === 'open_on_host' ? T.openOnHost(body?.spec?.name ?? '') : r === 'machine_refused' ? `${T.machineSays}: «${why}»` : why)
    }
    return j.result
  }

  function hostLine(h) {
    const i = h.info ?? {}
    return [i.hostname && i.hostname !== h.name ? i.hostname : '', [i.platform, i.arch].filter(Boolean).join(' '), i.claude ? `Claude ${i.claude.replace(/\s*\(Claude Code\)/, '')}` : '', i.tmux, i.version ? `host v${i.version}` : ''].filter(Boolean).join(' · ')
  }

  // A machine's allowed folders: removable, and one more can be added, when
  // the machine lets the dashboard change them (squadra-host 0.0.3+).
  function folderChips(h) {
    const i = h.info ?? {}
    const editable = h.online && i.folders_from_dashboard === true
    const chips = (i.folders ?? []).map(f => {
      const home = i.home && f === i.home
      return `<span class="fchip ${home ? 'home' : ''}" title="${esc(home ? T.homeFolder : f)}"><code>${home ? '🏠 ' : ''}${esc(f)}</code>${editable ? `<button type="button" data-hact="rmfolder" data-h="${esc(h.id)}" data-f="${esc(f)}" title="${esc(T.removeFolder(f))}" aria-label="${esc(T.removeFolder(f))}">✕</button>` : ''}</span>`
    }).join(' ')
    return `${chips || T.noFolders}${editable ? ` <button type="button" class="btn addf" data-hact="addfolder" data-h="${esc(h.id)}">${T.addFolder}</button>` : h.online && i.folders_from_dashboard === false && i.version ? ` <span class="t">(${T.foldersLocal})</span>` : ''}`
  }

  // Connected, disconnected, or enrolled and never connected yet.
  function hostState(h) {
    if (h.online) return T.hostOnline
    if (h.pending) return T.hostPending(h.created_at ? dur(now() - h.created_at) : '—')
    return T.hostOffline(h.last_seen_at ? dur(now() - h.last_seen_at) : '—')
  }
  function renderHosts(only) {
    const list = [...hosts.values()].filter(h => !only || h.id === only).sort((a, b) => (b.online - a.online) || COLLATOR.compare(a.name, b.name))
    if (!list.length) { setHtml($('hosts'), `<div class="host-list"><div class="mosaic-empty">${only && hosts.size ? `${T.machineNotFound} <a href="#/hosts">${T.allMachines}</a>` : T.noMachines}</div></div>`); return }
    setHtml($('hosts'), `<div class="host-list">${list.map(h => {
      const i = h.info ?? {}
      const terms = i.terminals ?? []
      const rows = terms.map(t => {
        const s = sessionOn(h.id, t.id)
        return `<div class="term-row">
          <span class="dot ${s ? status(s).dot : ''}" title="${esc(s ? status(s).text : '')}"></span><span class="n">${esc(t.name)}</span>${roleTag(t.role)}
          <span class="m" title="${esc(t.folder ?? '')}">${esc(t.folder ?? '')}${t.role === 'worker' && t.coordinator ? ` · ${esc(T.coordinatorOf(t.coordinator))}` : ''}</span>
          <span class="acts">
            ${h.online ? `<button class="btn" data-go="#/t/${encodeURIComponent(h.id)}/${encodeURIComponent(t.id)}">${T.terminal}</button>` : ''}
            ${s ? `<button class="btn" data-go="#/s/${encodeURIComponent(t.id)}">${T.chat}</button>` : ''}
            ${h.online ? `<button class="btn danger" data-hact="kill" data-h="${esc(h.id)}" data-t="${esc(t.id)}">${T.closeSession}</button>` : ''}
          </span></div>`
      }).join('')
      return `<div class="host ${h.online ? '' : 'offline'}">
        <div class="host-head"><span class="dot ${h.online ? 'ok' : ''}"></span><span class="n">${esc(h.name)}</span>
          <span class="m">${hostState(h)}${hostLine(h) ? ` · ${esc(hostLine(h))}` : ''}</span>
          <span class="acts">${h.online ? `<button class="btn" data-hact="new" data-h="${esc(h.id)}">${T.newSession}</button>` : `<button class="btn danger" data-hact="disconnect" data-h="${esc(h.id)}">${T.disconnect}</button>`}<button class="more" data-hmenu="${esc(h.id)}" aria-label="${esc(T.actions(h.name))}">⋯</button></span></div>
        <div class="host-meta">${i.version && serverVersion && olderThan(i.version, serverVersion) ? `<span class="plugin-missing">${T.hostOld(esc(i.version), esc(serverVersion))}</span>` : ''}${i.plugin ? (i.plugin.installed && i.plugin.enabled ? `<span>${T.pluginOk(esc(i.plugin.version ?? ''))}</span>` : `<span class="plugin-missing">${T.pluginMissing(!i.plugin.installed)}</span>`) : ''}<span class="folders">${T.folders}: ${folderChips(h)}</span>${i.max_sessions ? `<span>${T.maxSessions(i.max_sessions)}</span>` : ''}<span>${i.allow_input === false ? T.typingOff : T.typingOn}</span></div>
        <div class="host-terms">${rows || `<div class="host-empty">${T.noTerminals}</div>`}</div>
      </div>`
    }).join('')}</div>`)
  }

  $('hosts').addEventListener('click', e => {
    const m = e.target.closest('[data-hmenu]')
    if (m) return openHostMenu(m, m.dataset.hmenu)
    const go = e.target.closest('[data-go]')
    if (go) location.hash = go.dataset.go
    const act = e.target.closest('[data-hact]')
    if (act) hostAction(act.dataset.hact, act.dataset.h, act.dataset.t ?? act.dataset.f)
  })

  function openHostMenu(anchor, id) {
    closeMenu()
    const h = hosts.get(id)
    if (!h) return
    menuEl = document.createElement('div')
    menuEl.className = 'menu'
    menuEl.innerHTML = `<button data-a="rename">${T.rename}</button><button data-a="disconnect" class="danger">${T.disconnect}</button>`
    document.body.appendChild(menuEl)
    const r = anchor.getBoundingClientRect()
    const w = menuEl.offsetWidth
    menuEl.style.top = `${Math.min(r.bottom + 4, innerHeight - menuEl.offsetHeight - 8)}px`
    menuEl.style.left = `${Math.max(8, Math.min(r.right - w, innerWidth - w - 8))}px`
    menuEl.addEventListener('click', e => {
      const b = e.target.closest('button')
      if (!b) return
      closeMenu()
      hostAction(b.dataset.a, id)
    })
  }

  // A dialog with arbitrary content; returns its root and a close function.
  function dialog(html, { wide = false } = {}) {
    const bg = document.createElement('div')
    bg.className = 'modal-bg'
    bg.innerHTML = `<div class="modal ${wide ? 'wide' : ''}" role="dialog" aria-modal="true">${html}</div>`
    document.body.appendChild(bg)
    const close = () => { bg.remove(); bg.onclose?.() }
    bg.addEventListener('click', e => { if (e.target === bg || e.target.closest('[data-cancel]')) close() })
    return { el: bg, close }
  }

  function hostAction(action, id, term, extra = term) {
    const h = hosts.get(id)
    if (action === 'add') return addMachineDialog()
    if (action === 'new') return newSessionDialog(id)
    if (action === 'rename' && h) {
      const d = dialog(`<h3>${T.renameTitle}</h3><label class="field"><span>${T.name}</span><input type="text" maxlength="40" value="${esc(h.name)}"></label><div class="err" style="color:var(--err);font-size:13px;min-height:1.2em"></div>
        <div class="actions"><button class="btn" data-cancel>${T.cancel}</button><button class="btn primary" data-ok>${T.save}</button></div>`)
      const input = d.el.querySelector('input')
      input.focus(); input.select()
      const save = async () => {
        try { await postJson('/api/hosts/rename', { host: id, name: input.value }); d.close() } catch (err) { d.el.querySelector('.err').textContent = err.message }
      }
      d.el.querySelector('[data-ok]').addEventListener('click', save)
      input.addEventListener('keydown', e => { if (e.key === 'Enter') save() })
      return
    }
    if (action === 'addfolder' && h) return addFolderDialog(id)
    if (action === 'rmfolder' && h) {
      return confirmDialog({ title: T.removeFolderTitle, text: T.removeFolderText(esc(extra)), confirm: T.stopAllowing, danger: true, run: () => postJson('/api/hosts/folders', { host: id, action: 'remove', path: extra }) })
    }
    if (action === 'disconnect' && h) {
      return confirmDialog({ title: T.disconnectTitle(h.name), text: T.disconnectText(esc(h.name)), confirm: T.disconnect, danger: true, run: () => postJson('/api/hosts/remove', { host: id }) })
    }
    if (action === 'kill') {
      return confirmDialog({
        title: T.closeSessionTitle(term), text: T.closeSessionText(esc(term), esc(h?.name ?? id)), confirm: T.closeSession, danger: true,
        run: async () => {
          await postJson('/api/terminals/kill', { host: id, term })
          if (currentRoute().view === 'terminal') location.hash = '#/hosts'
        },
      })
    }
  }

  // Allow one more folder on a machine: it checks the path against its own
  // rules and says why when it can't be allowed. done(folder) after it is.
  function addFolderDialog(hostId, done) {
    const h = hosts.get(hostId)
    if (!h) return
    const d = dialog(`<h3>${esc(T.addFolderTitle(h.name))}</h3><p>${T.addFolderText} ${T.addFolderHome}</p>
      <label class="field"><span>${T.folderPath}</span><input type="text" maxlength="4096" placeholder="~/projects" autocomplete="off" spellcheck="false"></label>
      <div class="err" style="color:var(--err);font-size:13px;min-height:1.2em"></div>
      <div class="actions"><button class="btn" data-cancel>${T.cancel}</button><button class="btn primary" data-ok>${T.allow}</button></div>`)
    const input = d.el.querySelector('input')
    input.focus()
    const ok = d.el.querySelector('[data-ok]')
    const save = async () => {
      const path = input.value.trim()
      if (!path) return input.focus()
      ok.disabled = true
      try {
        const r = await postJson('/api/hosts/folders', { host: hostId, action: 'add', path })
        d.close()
        // (The machine's list as it answered: shown now, before its next update arrives.)
        const list = Array.isArray(r.folders) ? r.folders : null
        const host = hosts.get(hostId)
        if (host && list) host.info = { ...(host.info ?? {}), folders: list }
        done?.(list?.[list.length - 1] ?? null)
      } catch (err) { d.el.querySelector('.err').textContent = err.message.replace(/^Bad Request: /, ''); ok.disabled = false }
    }
    ok.addEventListener('click', save)
    input.addEventListener('keydown', e => { if (e.key === 'Enter') save() })
  }

  function addMachineDialog() {
    const d = dialog(`<h3>${T.addTitle}</h3><p>${T.addIntro}</p>
      <div data-step="1">
        <label class="field"><span>${T.machineName}</span><input type="text" maxlength="40" placeholder="${esc(T.machineNameHint)}"></label>
        <label class="check"><input type="checkbox"> <span>${T.configurePlugin}</span></label>
        <div class="err" style="color:var(--err);font-size:13px;min-height:1.2em"></div>
        <div class="actions"><button class="btn" data-cancel>${T.cancel}</button><button class="btn primary" data-gen>${T.generate}</button></div>
      </div>
      <div data-step="2" hidden>
        <div class="os-pick"><span>${T.osPick}</span><span class="seg">${['linux', 'macos', 'windows'].map(o => `<button type="button" data-os="${o}">${{ linux: 'Linux', macos: 'macOS', windows: 'Windows' }[o]}</button>`).join('')}</span></div>
        <div class="steps"></div>
        <div class="wait"><span class="dot info pulse"></span><span class="w">${T.waitingMachine}</span></div>
        <div class="actions"><button class="btn" data-cancel>${T.done}</button><button class="btn primary" data-newsession hidden>${T.newSession}</button></div>
      </div>`, { wide: true })
    const input = d.el.querySelector('input[type=text]')
    input.focus()
    let joined = null
    let ticket = null // this dialog's code: only the machine that used it counts
    const listener = h => {
      if (h.removed || !h.online || !ticket || h.enrollment !== ticket) return
      joined = h
      d.el.querySelector('.wait').innerHTML = `<span class="dot ok"></span><span>${T.machineJoined(esc(h.name))}</span>`
      d.el.querySelector('[data-newsession]').hidden = false
    }
    d.el.onclose = () => hostListeners.delete(listener)
    d.el.querySelector('[data-gen]').addEventListener('click', async e => {
      e.target.disabled = true
      try {
        const r = await postJson('/api/hosts/enroll', { name: input.value.trim(), configure_plugin: d.el.querySelector('input[type=checkbox]').checked })
        ticket = r.enrollment ?? null
        d.el.querySelector('[data-step="1"]').hidden = true
        d.el.querySelector('[data-step="2"]').hidden = false
        // One command for the machine's system, with its copy button.
        const guess = /Mac/i.test(navigator.platform) ? 'macos' : /Win/i.test(navigator.platform) ? 'windows' : 'linux'
        let os = guess, home = false, root = false
        const cmd = text => `<div class="cmdrow"><pre class="cmd">${esc(text)}</pre><button class="btn" data-copy>${T.copy}</button></div>`
        const insecure = /^http:\/\//.test(r.server_url) && !/^http:\/\/(localhost|127\.0\.0\.1|\[::1\])(:|\/|$)/.test(r.server_url)
        const draw = () => {
          for (const b of d.el.querySelectorAll('[data-os]')) b.classList.toggle('on', b.dataset.os === os)
          const extra = (home ? ' --allow-home' : '') + (root && os !== 'macos' ? ' --allow-root' : '') + (insecure ? ' --insecure' : '')
          d.el.querySelector('.steps').innerHTML = `<p>${T.runOn(os)}</p>${cmd(String(r.install?.[os] ?? '') + extra)}
            <label class="check"><input type="checkbox" data-home ${home ? 'checked' : ''}> <span>${T.allowHome}</span></label>
            ${os === 'macos' ? '' : `<label class="check"><input type="checkbox" data-root ${root ? 'checked' : ''}> <span>${T.allowRoot}</span></label>`}
            <p class="note">${T.runWhat}${os === 'windows' ? ` ${T.windowsNote}` : ''}</p>
            ${insecure ? `<p class="note" style="color:var(--err);font-size:13px">${esc(T.httpWarn)}</p>` : ''}
            <p class="note valid">${esc(T.codeValid(hhmm(r.expires_at)))}</p>
            <p class="note">${T.afterJoin}</p>
            ${os === 'windows' ? '' : `<details class="manual"><summary>${T.manualCmd}</summary>${cmd(String(r.command ?? '') + extra)}</details>`}`
        }
        draw()
        d.el.querySelector('.os-pick').addEventListener('click', ev => { const b = ev.target.closest('[data-os]'); if (b) { os = b.dataset.os; draw() } })
        d.el.querySelector('.steps').addEventListener('change', ev => {
          if (ev.target.matches('[data-home]')) { home = ev.target.checked; draw() }
          if (ev.target.matches('[data-root]')) { root = ev.target.checked; draw() }
        })
        hostListeners.add(listener)
        d.el.querySelector('.steps').addEventListener('click', async ev => {
          const b = ev.target.closest('[data-copy]')
          if (!b) return
          const pre = b.parentElement.querySelector('.cmd')
          try { await navigator.clipboard.writeText(pre.textContent); b.textContent = T.copied } catch {
            const range = document.createRange(); range.selectNodeContents(pre)
            getSelection().removeAllRanges(); getSelection().addRange(range)
          }
        })
        d.el.querySelector('[data-newsession]').addEventListener('click', () => { d.close(); location.hash = '#/hosts'; newSessionDialog(joined?.id) })
      } catch (err) {
        d.el.querySelector('.err').textContent = err.message
        e.target.disabled = false
      }
    })
  }

  // A worker for this coordinator's squad, by default on the coordinator's machine.
  // A session opened from here that ended (/quit, closed): open it again on
  // its machine, as it was.
  function reopenable(s) {
    const role = s?.opened_role ?? s?.role
    return !!(s && !s.online && !s.archived_at && s.host_id && hosts.get(s.host_id)?.online && !terminalOf(s.name) && ['coordinator', 'worker', 'solo'].includes(role))
  }
  function reopen(name) {
    const s = sessions.get(name)
    if (!reopenable(s)) return
    const role = s.opened_role ?? s.role
    newSessionDialog(s.host_id, { reopen: true, name, role, coordinator: role === 'worker' ? s.coordinator ?? undefined : undefined, folder: s.activity?.cwd ?? null })
  }

  function addWorkerTo(coord) {
    newSessionDialog(terminalOf(coord)?.host.id, { coordinator: coord })
  }

  function newSessionDialog(hostId, preset = {}) {
    const online = [...hosts.values()].filter(h => h.online)
    if (!online.length) return alertBox(T.noOnlineMachines)
    // Coordinators to suggest. A session declares its role itself, so only
    // one opened from the dashboard (host_id) is pre-filled; any other one
    // must be typed or picked on purpose.
    const coords = [...sessions.values()].filter(s => s.role === 'coordinator' && !s.deleted).map(s => s.name)
    const ownCoords = [...sessions.values()].filter(s => s.opened_role === 'coordinator' && s.role === 'coordinator' && s.host_id && !s.deleted).map(s => s.name)
    const hasCoord = !!preset.coordinator || ownCoords.length > 0
    // The worker's coordinator is picked from the ones that exist: those
    // opened from this dashboard first; the rest only declared it themselves.
    // Pre-selected only when it can't be anyone else (adding a worker to a
    // squad, or the dashboard's only coordinator).
    const coordOptions = () => {
      const list = [...new Set([...(preset.coordinator ? [preset.coordinator] : []), ...ownCoords, ...coords])]
      if (!list.length) return `<option value="">—</option>`
      const pick = preset.coordinator ?? (ownCoords.length === 1 ? ownCoords[0] : '')
      const label = c => {
        const st = sessions.get(c)
        return [c, ownCoords.includes(c) ? T.coordOwn : T.coordSelf, st && !st.online ? T.coordOffline : ''].filter(Boolean).join(' · ')
      }
      return `${pick ? '' : `<option value="" selected>${T.coordPick}</option>`}${list.map(c => `<option value="${esc(c)}" ${c === pick ? 'selected' : ''}>${esc(label(c))}</option>`).join('')}`
    }
    const d = dialog(`<h3>${preset.reopen ? esc(T.reopenTitle(preset.name)) : preset.coordinator ? esc(T.addWorkerTo(preset.coordinator)) : T.newSessionTitle}</h3>${preset.reopen ? `<p class="hint" style="font-size:12.5px;margin:-2px 0 12px">${T.reopenHint}</p>` : ''}
      <label class="field"><span>${T.machine}</span><select name="host">${online.map(h => `<option value="${esc(h.id)}" ${h.id === hostId ? 'selected' : ''}>${esc(h.name)}</option>`).join('')}</select></label>
      <div class="row2">
        <label class="field"><span>${T.role}</span><select name="role"><option value="worker" ${hasCoord ? 'selected' : ''}>${T.roleWorker}</option><option value="coordinator" ${hasCoord ? '' : 'selected'}>${T.roleCoordinator}</option><option value="solo">${T.roleSoloOption}</option></select></label>
        <label class="field"><span>${T.sessionName}</span><input type="text" name="name" maxlength="32" pattern="[A-Za-z0-9_-]{1,32}" autocomplete="off"></label>
      </div>
      <label class="field" data-only="worker"><span>${T.coordinatorName}</span><select name="coordinator">${coordOptions()}</select></label>
      <div class="row2">
        <label class="field"><span>${T.folder}</span><select name="folder"></select></label>
        <label class="field"><span>${T.subfolder}</span><input type="text" name="sub" placeholder="${esc(T.subfolderHint)}" autocomplete="off"></label>
      </div>
      <label class="field"><span>${T.compact}</span><select name="compact">
        <option value="600000" selected>${T.compactRec}</option>
        <option value="">${T.compactDefault}</option>
        ${[300, 400, 500, 700, 800].map(k => `<option value="${k * 1000}">${T.compactK(k)}</option>`).join('')}
      </select><span class="hint">${T.compactHint}</span></label>
      <p class="hint" style="font-size:12px;color:var(--muted);margin:0 0 8px">${T.resumeHint}</p>
      <div class="err" style="color:var(--err);font-size:13px;min-height:1.2em"></div>
      <div class="actions"><button class="btn" data-cancel>${T.cancel}</button><button class="btn primary" data-ok>${T.open}</button></div>`, { wide: true })
    const f = name => d.el.querySelector(`[name=${name}]`)
    const suggestName = () => {
      if (f('role').value === 'coordinator') return sessions.has('coord') && sessions.get('coord').online ? '' : 'coord'
      if (f('role').value === 'solo') { for (let i = 1; ; i++) if (!sessions.has(`claude${i}`) && !terminalOf(`claude${i}`)) return `claude${i}` }
      for (let i = 1; ; i++) if (!sessions.get(`worker${i}`)?.online && !terminalOf(`worker${i}`)) return `worker${i}`
    }
    // A coordinator that wasn't opened from this dashboard is only a name a
    // session gave itself: said right next to the field.
    const coordHint = document.createElement('div')
    coordHint.style.cssText = 'color:var(--err);font-size:12px;min-height:1em'
    f('coordinator').after(coordHint)
    const checkCoord = () => {
      const v = f('coordinator').value
      coordHint.textContent = !coords.length && !preset.coordinator ? T.coordNoneYet : v && !ownCoords.includes(v) ? `⚠ ${T.coordSelf}` : ''
    }
    f('coordinator').addEventListener('change', checkCoord)
    checkCoord()
    // The machine's allowed folders, kept current while the dialog is open
    // (one added there shows up here by itself).
    const folderHint = document.createElement('div')
    folderHint.className = 'hint'
    folderHint.style.cssText = 'font-size:12px;color:var(--muted)'
    d.el.querySelector('[name=folder]').closest('.row2').after(folderHint)
    let shownFolders = null
    const syncFolders = () => {
      const h = hosts.get(f('host').value)
      const folders = h?.info?.folders ?? []
      const key = JSON.stringify(folders)
      if (key === shownFolders) return
      shownFolders = key
      const was = f('folder').value
      f('folder').innerHTML = folders.length ? folders.map(x => `<option value="${esc(x)}" ${x === was ? 'selected' : ''}>${x === h?.info?.home ? '🏠 ' : ''}${esc(x)}</option>`).join('') : `<option value="">—</option>`
      noteFolder()
    }
    // What to do without folders (+ Folder right here), or what a session in
    // the home folder means.
    const noteFolder = () => {
      const h = hosts.get(f('host').value)
      const editable = h?.info?.folders_from_dashboard === true
      if (!(h?.info?.folders ?? []).length) folderHint.innerHTML = `${T.noFoldersHere}${editable ? ` <button type="button" class="btn" data-addf>${T.addFolder}</button>` : ''}`
      else folderHint.innerHTML = h?.info?.home && f('folder').value === h.info.home && !f('sub').value.trim() ? `⚠ ${T.homeSession}` : ''
    }
    folderHint.addEventListener('click', e => { if (e.target.closest('[data-addf]')) addFolderDialog(f('host').value, folder => { shownFolders = null; syncFolders(); if (folder) f('folder').value = folder; noteFolder(); renderHosts(currentRoute().host) }) })
    const soloHint = document.createElement('p')
    soloHint.className = 'hint'
    soloHint.style.cssText = 'font-size:12px;color:var(--muted);margin:-4px 0 10px'
    soloHint.textContent = T.soloHint
    d.el.querySelector('.row2').after(soloHint)
    const sync = () => {
      d.el.querySelector('[data-only=worker]').hidden = f('role').value !== 'worker'
      soloHint.hidden = f('role').value !== 'solo'
      syncFolders()
    }
    const onHost = h => { if (h.id === f('host').value) syncFolders() }
    hostListeners.add(onHost)
    const closed = d.el.onclose
    d.el.onclose = () => { hostListeners.delete(onHost); closed?.() }
    f('role').addEventListener('change', () => { f('name').value = suggestName(); sync() })
    f('host').addEventListener('change', sync)
    f('folder').addEventListener('change', noteFolder)
    f('sub').addEventListener('input', noteFolder)
    f('name').value = suggestName()
    // Reopening a session: what it was opened with, and the last folder it worked in.
    if (preset.reopen) {
      f('role').value = preset.role
      f('name').value = preset.name
      sync()
      const folders = hosts.get(f('host').value)?.info?.folders ?? []
      const base = preset.folder ? folders.filter(x => preset.folder === x || preset.folder.startsWith(x.replace(/\/+$/, '') + '/')).sort((a, b) => b.length - a.length)[0] : null
      if (base) { f('folder').value = base; f('sub').value = preset.folder.slice(base.replace(/\/+$/, '').length).replace(/^\/+/, ''); noteFolder() }
    }
    sync()
    f('name').focus()
    const ok = d.el.querySelector('[data-ok]')
    ok.addEventListener('click', async () => {
      const err = d.el.querySelector('.err')
      err.textContent = ''
      const host = f('host').value
      const base = f('folder').value
      const sub = f('sub').value.trim().replace(/^\/+|\/+$/g, '')
      const spec = {
        name: f('name').value.trim(),
        role: f('role').value,
        folder: sub ? `${base.replace(/\/+$/, '')}/${sub}` : base,
      }
      if (spec.role === 'worker') {
        // A worker's coordinator is always chosen, never assumed: a session
        // can call itself "coord" without being yours.
        spec.coordinator = f('coordinator').value
        if (!/^[A-Za-z0-9_-]{1,32}$/.test(spec.coordinator)) { err.textContent = T.coordRequired; f('coordinator').focus(); return }
      }
      if (!base) { err.textContent = T.folderRequired; f('folder').focus(); return }
      if (f('compact').value) spec.compact_window = Number(f('compact').value)
      if (!/^[A-Za-z0-9_-]{1,32}$/.test(spec.name)) { err.textContent = T.sessionName + ': A-Z a-z 0-9 _ -'; f('name').focus(); return }
      ok.disabled = true
      ok.textContent = T.opening
      try {
        await postJson('/api/terminals/open', { host, spec })
        d.close()
        location.hash = `#/t/${encodeURIComponent(host)}/${encodeURIComponent(spec.name)}`
      } catch (e) {
        err.textContent = e.message
        ok.disabled = false
        ok.textContent = T.open
      }
    })
  }

  // ---------------------------------------------------------------------------
  // web terminal: xterm.js (loaded on first use) over one WebSocket per tab
  let xtermReady = null
  function loadXterm() {
    if (xtermReady) return xtermReady
    // Served by squadra-server itself (vendor/): no third-party scripts.
    const css = document.createElement('link')
    css.rel = 'stylesheet'
    css.href = '/vendor/xterm.css'
    document.head.appendChild(css)
    const script = src => new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s) })
    xtermReady = script('/vendor/xterm.js').then(() => script('/vendor/addon-fit.js'))
    xtermReady.catch(() => { xtermReady = null })
    return xtermReady
  }

  const b64bytes = b => Uint8Array.from(atob(b), c => c.charCodeAt(0))

  const termLink = {
    ws: null, ready: false, views: new Set(), backoff: 1000, timer: null,
    retry() {
      for (const v of this.views) v.overlay(T.termLinkDown)
      if (this.views.size) { clearTimeout(this.timer); this.timer = setTimeout(() => this.ensure(), this.backoff); this.backoff = Math.min(this.backoff * 2, 15000) }
    },
    ensure() {
      if (this.ws || this.connecting || !token) return
      // A one-time ticket (the token itself never goes in the socket request):
      // the server only accepts the socket with it.
      this.connecting = true
      postJson('/api/terminal/ticket', {}).then(({ ticket }) => {
        this.connecting = false
        if (!this.ws && this.views.size) this.open(ticket)
      }, () => { this.connecting = false; if (token) this.retry() })
    },
    open(ticket) {
      const ws = this.ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/api/terminal`, ['squadra', `auth.${ticket}`])
      ws.onmessage = ev => {
        let m
        try { m = JSON.parse(ev.data) } catch { return }
        if (m.t === 'ready') { this.ready = true; this.backoff = 1000; for (const v of this.views) v.attach(); return }
        for (const v of this.views) if (v.host === m.host && v.term === m.term) v.onMessage(m)
      }
      ws.onclose = ev => {
        if (this.ws !== ws) return
        this.ws = null
        this.ready = false
        this.retry()
      }
    },
    send(m) { if (this.ready && this.ws?.readyState === 1) this.ws.send(JSON.stringify(m)) },
    add(v) { this.views.add(v); this.ensure(); if (this.ready) v.attach() },
    remove(v) { this.send({ t: 'detach', host: v.host, term: v.term }); this.views.delete(v) },
    close() { clearTimeout(this.timer); const ws = this.ws; this.ws = null; this.ready = false; this.views.clear(); ws?.close() },
  }

  let termView = null
  class TermView {
    // compact: a pane of a mosaic (no long hint underneath, never focused by
    // itself); root gets "term-focused" while typing goes to this terminal.
    constructor(host, term, root, { compact = false } = {}) {
      this.host = host
      this.term = term
      this.dead = false
      this.compact = compact
      this.root = root
      root.innerHTML = `<div class="term-box"><div class="term-over">${T.termLoading}</div></div><div class="term-foot"></div>`
      this.box = root.querySelector('.term-box')
      this.over = root.querySelector('.term-over')
      this.foot = root.querySelector('.term-foot')
      this.renderFoot()
      loadXterm().then(() => { if (!this.dead) this.start() }, () => this.overlay(T.termLoadFailed))
    }

    renderFoot() {
      const h = hosts.get(this.host)
      const ro = h?.info?.allow_input === false
      this.foot.innerHTML = (ro ? `<span class="ro">👁 ${T.readOnly}</span><span>${esc(T.typingOff)}</span>` : this.compact ? '' : `<span>${esc(T.termHint(h?.name ?? this.host))}</span>`) +
        (this.notice ? `<span class="ro">⚠ ${T.machineSays}: ${esc(this.notice)}</span>` : '')
    }

    // A pasted image, at most the size Claude uses (1568 px on its long side)
    // and small enough to send: PNG, or WebP/JPEG, smaller if needed.
    async pasteImage(file) {
      if (hosts.get(this.host)?.info?.allow_input === false) return this.toast(T.typingOff)
      try {
        const bmp = await createImageBitmap(file)
        let scale = Math.min(1, 1568 / Math.max(bmp.width, bmp.height))
        let data = null, type = null
        for (let i = 0; i < 6 && !data; i++, scale *= 0.75) {
          const c = document.createElement('canvas')
          c.width = Math.max(1, Math.round(bmp.width * scale)); c.height = Math.max(1, Math.round(bmp.height * scale))
          c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height)
          for (const [t, q] of [['image/png'], ['image/webp', 0.9], ['image/jpeg', 0.85]]) {
            const blob = await new Promise(r => c.toBlob(r, t, q))
            if (!blob || blob.type !== t || blob.size > 580_000) continue
            const url = await new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(String(fr.result)); fr.onerror = rej; fr.readAsDataURL(blob) })
            data = url.slice(url.indexOf(',') + 1); type = t
            break
          }
        }
        bmp.close?.()
        if (!data) throw new Error('too large')
        termLink.send({ t: 'image', host: this.host, term: this.term, type, data })
        this.toast(T.imageSent)
        this.x.focus()
      } catch { this.toast(T.imageFailed) }
    }

    // A short note over the terminal ("Copied").
    toast(text) {
      this.box.querySelector('.term-toast')?.remove()
      const t = document.createElement('div')
      t.className = 'term-toast'
      t.textContent = text
      this.box.appendChild(t)
      setTimeout(() => t.remove(), 1200)
    }

    start() {
      const dark = { background: '#161513', foreground: '#ecebe7', cursor: '#e0855f', selectionBackground: '#4a4740' }
      this.x = new window.Terminal({
        fontFamily: 'ui-monospace, SFMono-Regular, Menlo, Consolas, monospace', fontSize: 13.5, cursorBlink: true, scrollback: 5000, theme: dark, allowProposedApi: false,
        // (On macOS, Option+drag selects even when the program uses the mouse;
        // Shift+drag does everywhere.)
        macOptionClickForcesSelection: true,
        // Links printed by the program (OSC 8): only http(s), after a confirmation, in a new tab.
        // Only plain http(s) links, shown as they are (no user:password@, no
        // control or direction characters that could make it read otherwise).
        linkHandler: { activate: (e, uri) => {
          let u
          try { u = new URL(uri) } catch { return }
          if (!/^https?:$/.test(u.protocol) || u.username || u.password || /[\u0000-\u001f\u007f-\u009f\u200b-\u200f\u202a-\u202e\u2066-\u2069]/.test(uri)) return
          if (confirm(`${T.openLink}\n${u.href}`)) window.open(u.href, '_blank', 'noopener,noreferrer')
        } },
      })
      this.fit = new window.FitAddon.FitAddon()
      this.x.loadAddon(this.fit)
      this.x.open(this.box)
      this.fitNow()
      // Copying, as in usual terminals: what is selected is copied by itself;
      // Ctrl+Shift+C (Cmd+C on macOS) copies too, and so does Ctrl+C while
      // something is selected (without a selection it still goes to Claude).
      const copy = async () => {
        const text = this.x.getSelection()
        if (!text) return false
        try { await navigator.clipboard.writeText(text) } catch {
          const ta = document.createElement('textarea')
          ta.value = text
          ta.style.cssText = 'position:fixed;opacity:0;top:0;left:0'
          document.body.appendChild(ta)
          ta.select()
          try { document.execCommand('copy') } catch {}
          ta.remove()
          this.x.focus()
        }
        this.toast(T.copied)
        return true
      }
      let selTimer = null
      this.x.onSelectionChange(() => {
        clearTimeout(selTimer)
        if (this.x.hasSelection()) selTimer = setTimeout(() => { void copy() }, 250)
      })
      this.x.attachCustomKeyEventHandler(e => {
        // Ctrl+V pastes (text or an image) instead of sending ^V to Claude,
        // whose own image paste reads the machine's clipboard, not this one.
        if (e.type === 'keydown' && e.code === 'KeyV' && e.ctrlKey && !e.altKey && !e.metaKey) return false
        if (e.type !== 'keydown' || e.code !== 'KeyC' || !this.x.hasSelection()) return true
        if ((e.ctrlKey && !e.altKey) || (e.metaKey && !e.ctrlKey)) {
          e.preventDefault()
          void copy().then(() => this.x.clearSelection())
          return false
        }
        return true
      })
      // What xterm.js answers by itself to a program's queries (device
      // attributes, cursor position, modes, focus) isn't sent: tmux already
      // answers them, and every dashboard watching would type them in again.
      // (Unless a key was just pressed: Shift+F3 also looks like a report.)
      let keyAt = 0
      this.box.addEventListener('keydown', () => { keyAt = performance.now() }, true)
      const REPORT = /^(?:\x1b\[[?>=]?[\d;]*c|\x1b\[\??\d+;\d+R|\x1b\[\??[\d;]*\$y|\x1bP[01]\$r[^\x1b]*\x1b\\|\x1b\[[IO]|\x1b\[[\d;]*t|\x1b\][\d;]*rgb:[^\x07\x1b]*(?:\x07|\x1b\\))+$/
      this.x.onData(data => {
        if (hosts.get(this.host)?.info?.allow_input === false) return
        if (REPORT.test(data) && performance.now() - keyAt > 100) return
        termLink.send({ t: 'in', host: this.host, term: this.term, data })
      })
      // Pasted text can't carry escape sequences (they could end bracketed
      // paste and run what follows): control and bidi characters are dropped.
      this.box.addEventListener('paste', e => {
        // An image (a screenshot): sent to the machine, which hands it to
        // Claude Code. (Claude Code can't read this browser's clipboard.)
        const text = e.clipboardData?.getData('text') ?? ''
        const image = text ? null : [...(e.clipboardData?.items ?? [])].find(i => i.kind === 'file' && /^image\//.test(i.type))?.getAsFile()
        if (image) { e.preventDefault(); e.stopPropagation(); void this.pasteImage(image); return }
        const clean = text.replace(/[\u0000-\u0008\u000b-\u001f\u007f-\u009f\u00ad\u034f\u061c\u180e\u200b-\u200f\u2028\u2029\u202a-\u202e\u2060-\u2064\u2066-\u2069\u115f\u1160\u17b4\u17b5\u2065\u2800\u3164\uffa0\ufeff\ufff9-\ufffb\u{1d173}-\u{1d17a}\u{e0000}-\u{e007f}\u180b-\u180f\ufe00-\ufe0f\u{e0100}-\u{e01ef}\p{Cf}]/gu, '')
        if (clean !== text) { e.preventDefault(); e.stopPropagation(); this.x.paste(clean) }
      }, true)
      let resizeTimer = null
      this.x.onResize(({ cols, rows }) => {
        clearTimeout(resizeTimer)
        resizeTimer = setTimeout(() => termLink.send({ t: 'resize', host: this.host, term: this.term, cols, rows }), 150)
      })
      this.ro = new ResizeObserver(() => this.fitNow())
      this.ro.observe(this.box)
      // Not when the page was opened straight on this terminal (e.g. from a
      // link): typing goes to a machine only after the user chose it here.
      // (Nor a mosaic's pane: there it is clicked first.)
      if (navigatedInApp && !this.compact) this.x.focus()
      this.x.textarea?.addEventListener('focus', () => this.root.classList.add('term-focused'))
      this.x.textarea?.addEventListener('blur', () => this.root.classList.remove('term-focused'))
      termLink.add(this)
    }

    fitNow() { try { this.fit?.fit() } catch {} }

    attach() {
      if (!this.x) return
      this.overlay(null)
      termLink.send({ t: 'attach', host: this.host, term: this.term, cols: this.x.cols, rows: this.x.rows })
    }

    refresh() { termLink.send({ t: 'refresh', host: this.host, term: this.term }) }

    overlay(text) {
      this.over.hidden = !text
      if (text) this.over.textContent = text
    }

    onMessage(m) {
      if (m.t === 'screen') { this.x.reset(); this.x.write(b64bytes(m.data)); this.overlay(null); return }
      if (m.t === 'out') { this.x.write(b64bytes(m.data)); return }
      if (m.t === 'exit') return this.overlay(T.termEnded)
      if (m.t === 'host_down') return this.overlay(T.termHostDown)
      // What the machine says goes next to the footer, never in place of it:
      // the read-only state shown always comes from the machine's settings.
      if (m.t === 'notice') { this.notice = String(m.text ?? '').slice(0, 300); this.renderFoot() }
    }

    destroy() {
      this.dead = true
      this.ro?.disconnect()
      if (this.x) termLink.remove(this)
      this.x?.dispose()
    }
  }

  // A machine that comes back: re-attach the terminal on screen.
  hostListeners.add(h => {
    const terms = [termView, ...[...mosaicPanes.values()].filter(p => p.kind === 'term').map(p => p.view)]
    for (const v of terms) {
      if (!v || v.host !== h.id) continue
      v.renderFoot()
      if (h.online && !v.over.hidden && v.over.textContent === T.termHostDown) v.attach()
    }
  })

  // ---------------------------------------------------------------------------
  // live stream
  function onStream(type, data) {
    if (type === 'hello') {
      serverSkew = data.server_time - Date.now()
      if (data.version) setVersion(data.version)
      sessions.clear()
      for (const s of data.sessions) sessions.set(s.name, s)
      groups = data.groups ?? []
      hosts.clear()
      for (const h of data.hosts ?? []) hosts.set(h.id, h)
      // After a reconnect, what happened in between isn't in the open chats:
      // they load again from the server.
      if (streamHelloSeen) for (const v of views) v.reset()
      streamHelloSeen = true
      route()
      return
    }
    if (type === 'host') {
      if (data.removed) hosts.delete(data.id); else hosts.set(data.id, data)
      for (const fn of hostListeners) fn(data)
      const r = currentRoute()
      if (r.view === 'hosts') { if (r.host && data.removed && data.id === r.host) { location.hash = '#/hosts'; return } renderHosts(r.host); soon(renderTop) }
      if (r.view === 'terminal' || r.view === 'session') soon(renderTop)
      // A session's terminal opened or ended: its view switches between terminal and chat.
      if (r.view === 'session' && !!sessionTerm(r) !== (!!termView && !$('terminal').hidden)) soon(route)
      if (r.view === 'mosaic' || r.view === 'leads') {
        for (const [name, p] of mosaicPanes) { const s = sessions.get(name); if (s) setHtml(p.pane.querySelector('.pane-head'), paneHead(s)) }
        // A session whose terminal opened or ended: its pane switches between terminal and chat.
        const terms = r.view === 'leads' || mosaicMode === 'terms'
        if ([...mosaicPanes].some(([name, p]) => (terms && !!terminalOf(name)) !== (p.kind === 'term'))) soon(buildMosaic)
      }
      soon(renderNav)
      return
    }
    if (type === 'session') {
      const prev = sessions.get(data.name)
      if (data.deleted) { sessions.delete(data.name); unread.delete(data.name) } else sessions.set(data.name, data)
      const r = currentRoute()
      if (r.view === 'mosaic' || r.view === 'leads') {
        if (!prev || data.deleted || !!prev.archived_at !== !!data.archived_at || prev.role !== data.role || prev.coordinator !== data.coordinator) buildMosaic()
        else { const p = mosaicPanes.get(data.name); if (p) { p.pane.className = paneClass(data); setHtml(p.pane.querySelector('.pane-head'), paneHead(data)) } soon(refreshSquadRows); soon(refreshLeads) }
      }
      if (r.view === 'archived') renderArchived()
      if (r.view === 'session' && r.name === data.name && data.deleted) { location.hash = '#/'; return }
      for (const v of views) if (v.name === data.name) { v.renderStatus(); v.scheduleRender() }
      soon(renderNav)
      // The top bar shows one session (or one squad): only its changes matter.
      if ((r.view === 'session' && r.name === data.name) || r.view === 'terminal' || r.squad) soon(renderTop)
      return
    }
    if (type === 'cleared') {
      const s = sessions.get(data.session)
      if (s) s.cleared_at = data.at
      for (const v of views) if (v.name === data.session) v.reset()
      unread.delete(data.session)
      soon(renderNav)
      return
    }
    if (type === 'edited') {
      // An edited message: the new text replaces the old one where it is shown.
      for (const v of views) {
        const i = v.items.findIndex(x => x.t === 'message' && x.id === data.id)
        if (i >= 0) { v.items[i] = { ...v.items[i], text: data.text, edited_at: data.edited_at }; v.scheduleRender() }
      }
      return
    }
    if (type === 'event' || type === 'message') {
      const it = type === 'event' ? { ...data, t: 'event' } : { ...data, t: 'message', ts: data.created_at }
      if (it.t === 'event' && it.kind === 'usage') return
      let shown = false
      for (const v of views) if (v.live(it)) shown = true
      // unread counters for sessions not on screen
      const r = currentRoute()
      if (r.view === 'session') {
        const owners = it.t === 'event' ? [it.session] : [it.from, it.target].filter(n => sessions.has(n))
        let changed = false
        for (const n of owners) if (n !== r.name) { unread.set(n, (unread.get(n) ?? 0) + 1); changed = true }
        if (changed) soon(renderNav)
      }
      void shown
    }
  }

  function setConn(cls, text) { $('connDot').className = `dot ${cls}`; $('connText').textContent = text }

  // Each sign-in has its own stream loop: an older one (waiting to reconnect
  // when the admin logged out) stops instead of opening a second stream.
  let streamGen = 0
  async function connect() {
    const gen = ++streamGen
    let backoff = 1000
    for (;;) {
      if (gen !== streamGen) return
      streamAbort = new AbortController()
      try {
        const r = await fetch('/api/stream', { headers: { Authorization: `Bearer ${token}` }, signal: streamAbort.signal })
        if (r.status === 401) return showLogin(T.tokenInvalid)
        if (!r.ok || !r.body) throw new Error(`HTTP ${r.status}`)
        setConn('ok', T.live)
        backoff = 1000
        const reader = r.body.getReader()
        const dec = new TextDecoder()
        let buf = ''
        for (;;) {
          const { value, done } = await reader.read()
          if (done) break
          buf += dec.decode(value, { stream: true })
          let i
          while ((i = buf.indexOf('\n\n')) >= 0) {
            const block = buf.slice(0, i); buf = buf.slice(i + 2)
            let type = 'message', data = ''
            for (const line of block.split('\n')) {
              if (line.startsWith('event: ')) type = line.slice(7)
              else if (line.startsWith('data: ')) data += line.slice(6)
            }
            if (data) { try { onStream(type, JSON.parse(data)) } catch (e) { console.error(e) } }
          }
        }
      } catch (e) {
        if (e.name === 'AbortError') return
      }
      if (gen !== streamGen) return
      setConn('err', T.reconnecting)
      await new Promise(res => setTimeout(res, backoff))
      backoff = Math.min(backoff * 2, 15000)
    }
  }

  // What needs you, across every session: permissions and nearly-full contexts.
  function renderAlerts() {
    const box = $('alerts')
    if (!box) return
    // Sessions opened from the dashboard (host_id) first: a flood from other
    // sessions can't push them out of view.
    const list = sortedSessions().filter(s => s.online).sort((a, b) => !!b.host_id - !!a.host_id)
    const items = []
    for (const s of list) {
      const st = status(s)
      if (st.waiting) {
        const a = s.activity ?? {}
        const what = a.tool ? `${toolName(a.tool.name)}${a.tool.summary ? ` · ${a.tool.summary}` : ''}` : a.waiting
        items.push({ cls: '', name: s.name, html: T.alertPerm(esc(s.name), esc(what ?? '')) })
      }
    }
    for (const s of list) {
      const p = s.activity?.context_pct
      if (p != null && p >= 80) items.push({ cls: 'ctxw', name: s.name, html: T.alertCtx(esc(s.name), p) })
    }
    const key = items.map(i => i.html).join('|')
    if (box.dataset.key === key) return
    box.dataset.key = key
    box.hidden = !items.length
    const shown = items.slice(0, 4)
    box.innerHTML = items.length ? `<span class="lbl">${T.needsYou}</span>${shown.map(i => `<button class="alert ${i.cls}" data-go="#/s/${encodeURIComponent(i.name)}">${i.html}</button>`).join('')}${items.length > shown.length ? `<span class="t">${T.alertMore(items.length - shown.length)}</span>` : ''}` : ''
  }
  $('alerts').addEventListener('click', e => {
    const b = e.target.closest('[data-go]')
    if (!b) return
    // The machine's terminal is where a permission is answered, when there is one.
    const name = dec(b.dataset.go.slice(4))
    const where = terminalOf(name)
    location.hash = where && sessions.get(name) && status(sessions.get(name)).waiting ? `#/t/${encodeURIComponent(where.host.id)}/${encodeURIComponent(name)}` : b.dataset.go
  })

  setInterval(() => {
    for (const v of views) v.tick()
    renderNav()
    renderAlerts()
    refreshSquadRows()
    const r = currentRoute()
    if (r.view === 'mosaic' || r.view === 'leads') for (const [name, p] of mosaicPanes) { const s = sessions.get(name); if (s) p.pane.querySelector('.pane-head .dot').className = `dot ${status(s).dot}` }
    refreshLeads()
  }, 1000)

  // ---------------------------------------------------------------------------
  // login: the dashboard is only built after the server accepts the token
  function show(id) { for (const x of ['splash', 'login', 'app']) $(x).hidden = x !== id }

  // keep: the server couldn't be reached (not a wrong token): the saved token stays.
  function showLogin(err = '', { keep = false } = {}) {
    streamGen++
    streamAbort?.abort()
    // (Open dialogs go too: an enrollment command isn't left over the login page.)
    for (const m of document.querySelectorAll('.modal-bg')) { try { m.onclose?.() } catch {} ; m.remove() }
    clearMosaic()
    sessionView?.destroy(); sessionView = null
    termView?.destroy(); termView = null
    termLink.close()
    sessions.clear()
    hosts.clear()
    closeMenu()
    // (Not a token another tab has just signed in with.)
    if (!keep) { if ((store.get('squadraToken') ?? token) === token) store.del('squadraToken'); store.del('swarmToken') }
    token = null
    show('login')
    $('loginErr').textContent = err
    $('tokenInput').value = ''
    $('tokenInput').focus()
  }

  async function enter(candidate) {
    token = candidate
    await api('/api/state') // throws if the token is wrong
    store.set('squadraToken', token)
    $('tokenInput').value = ''
    show('app')
    connect()
  }

  $('loginForm').addEventListener('submit', async e => {
    e.preventDefault()
    $('loginBtn').disabled = true
    $('loginErr').textContent = ''
    try {
      await enter($('tokenInput').value.trim())
    } catch (err) {
      token = null
      $('loginErr').textContent = err.status === 401 ? T.tokenWrong : T.cannotConnect(err.message)
    } finally {
      $('loginBtn').disabled = false
    }
  })

  $('logoutBtn').addEventListener('click', () => showLogin())

  // static texts, version footer and language switch
  $('splash').textContent = T.connecting
  $('loginIntro').innerHTML = T.loginIntro
  $('tokenInput').placeholder = T.tokenPlaceholder
  $('loginBtn').textContent = T.enter
  $('connText').textContent = T.connecting
  $('logoutBtn').textContent = T.logout
  $('logoutBtn').title = T.logoutTitle
  $('menuBtn').setAttribute('aria-label', T.sessionsMenu)
  $('addHostBtn').title = T.addTitle
  $('addHostBtn').setAttribute('aria-label', T.addTitle)
  // The button shows the mode it switches to.
  function themeButtons() {
    const dark = themeNow() === 'dark'
    for (const b of document.querySelectorAll('[data-theme-toggle]')) {
      b.textContent = dark ? '☀️' : '🌙'
      b.title = dark ? T.lightMode : T.darkMode
      b.setAttribute('aria-label', b.title)
    }
  }
  for (const b of document.querySelectorAll('[data-theme-toggle]')) {
    b.addEventListener('click', () => {
      const next = themeNow() === 'dark' ? 'light' : 'dark'
      document.documentElement.dataset.theme = next
      store.set('squadraTheme', next)
      themeButtons()
    })
  }
  darkQuery.addEventListener('change', themeButtons)
  themeButtons()
  for (const b of document.querySelectorAll('[data-lang]')) {
    b.classList.toggle('on', b.dataset.lang === LANG)
    b.addEventListener('click', () => { store.set('squadraLang', b.dataset.lang); location.reload() })
  }
  // "0.0.2" < "0.0.3" (numeric parts).
  const olderThan = (a, b) => {
    const x = String(a).split('.').map(n => parseInt(n, 10)), y = String(b).split('.').map(n => parseInt(n, 10))
    if ([...x, ...y].some(Number.isNaN)) return false
    for (let i = 0; i < Math.max(x.length, y.length); i++) if ((x[i] ?? 0) !== (y[i] ?? 0)) return (x[i] ?? 0) < (y[i] ?? 0)
    return false
  }
  function setVersion(v) {
    serverVersion = v
    for (const el of document.querySelectorAll('.ver')) el.textContent = `Squadra v${v}`
  }
  fetch('/health').then(r => r.json()).then(j => { if (j.version) setVersion(j.version) }).catch(() => {})

  // Logged out in another tab of this browser: this one too.
  window.addEventListener('storage', e => { if (e.key === 'squadraToken' && !e.newValue && token) showLogin() })

  // boot
  if (token) {
    show('splash')
    enter(token).catch(err => err.status === 401 ? showLogin(T.storedTokenInvalid) : showLogin(T.cannotConnect(err.message), { keep: true }))
  } else {
    show('login')
    $('tokenInput').focus()
  }
})()
</script>
</body>
</html>
