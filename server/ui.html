<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Squadra</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2215%22%20fill%3D%22%23C15F3C%22/%3E%3Cg%20fill%3D%22%23fff%22%3E%3Ccircle%20cx%3D%2232%22%20cy%3D%2219%22%20r%3D%226.4%22/%3E%3Ccircle%20cx%3D%2223.5%22%20cy%3D%2228.5%22%20r%3D%224.4%22/%3E%3Ccircle%20cx%3D%2240.5%22%20cy%3D%2228.5%22%20r%3D%224.4%22/%3E%3Ccircle%20cx%3D%2216.5%22%20cy%3D%2237%22%20r%3D%223.5%22/%3E%3Ccircle%20cx%3D%2247.5%22%20cy%3D%2237%22%20r%3D%223.5%22/%3E%3Ccircle%20cx%3D%2210.5%22%20cy%3D%2245%22%20r%3D%222.7%22/%3E%3Ccircle%20cx%3D%2253.5%22%20cy%3D%2245%22%20r%3D%222.7%22/%3E%3C/g%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f5f4ef; --panel: #ffffff; --panel-2: #efede6; --line: #e1ded5; --text: #1f1e1c; --muted: #6f6c66;
    --accent: #c15f3c;
    --coord: #7c4dbd; --coord-soft: #efe7fa;   /* coordinators */
    --worker: #1f7a8c; --worker-soft: #e2f1f3; /* workers */
    --ok: #2f8f5b; --warn: #b7791f; --err: #c0392b; --info: #3b6fb6; --idle: #9a968d;
    --bubble: #ece9e1; --bubble-in: #e7eef7;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --pane-h: clamp(340px, calc((100vh - 120px) / 2), 720px);
    color-scheme: light;
  }
  /* Dark: the system's choice, unless light was chosen here; or chosen here. */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1a1917; --panel: #22211f; --panel-2: #2a2926; --line: #393733; --text: #ecebe7; --muted: #a29e96;
      --accent: #e0855f;
      --coord: #b08ae8; --coord-soft: #2e2639;
      --worker: #5cb8c9; --worker-soft: #1e3236;
      --ok: #4fb57e; --warn: #e0a93f; --err: #e2665a; --info: #6d9be0; --idle: #8a877f;
      --bubble: #302e2a; --bubble-in: #26303b;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1a1917; --panel: #22211f; --panel-2: #2a2926; --line: #393733; --text: #ecebe7; --muted: #a29e96;
    --accent: #e0855f;
    --coord: #b08ae8; --coord-soft: #2e2639;
    --worker: #5cb8c9; --worker-soft: #1e3236;
    --ok: #4fb57e; --warn: #e0a93f; --err: #e2665a; --info: #6d9be0; --idle: #8a877f;
    --bubble: #302e2a; --bubble-in: #26303b;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  button, input, select { font: inherit; color: inherit; }
  a { color: var(--info); }
  code { font-family: var(--mono); font-size: .92em; background: var(--panel-2); padding: 1px 4px; border-radius: 4px; }
  [hidden] { display: none !important; }

  /* --- login ------------------------------------------------------------------ */
  #login, #splash { min-height: 100%; display: grid; place-items: center; padding: 16px; }
  .login-card { width: min(400px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 28px; box-shadow: 0 8px 30px rgba(0,0,0,.06); }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 18px; margin-bottom: 4px; }
  .brand .logo { width: 30px; height: 30px; flex: none; }
  .login-card p { color: var(--muted); margin: 6px 0 18px; }
  .login-card input { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 9px; background: var(--bg); font-family: var(--mono); }
  .login-card button { width: 100%; margin-top: 12px; padding: 10px; border: 0; border-radius: 9px; background: var(--accent); color: #fff; font-weight: 600; cursor: pointer; }
  .login-card button:disabled { opacity: .6; cursor: default; }
  .login-err { color: var(--err); min-height: 1.4em; margin-top: 10px; font-size: 13px; }
  #splash { color: var(--muted); }

  /* --- app shell --------------------------------------------------------------- */
  #app { height: 100%; display: grid; grid-template-columns: 250px minmax(0, 1fr); }
  #side { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  #side .brand { padding: 14px 14px 8px; font-size: 16px; }
  #side .brand .logo { width: 26px; height: 26px; }
  .nav { overflow: auto; padding: 4px 8px 12px; flex: 1; }
  .nav-label { font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); padding: 10px 8px 4px; }
  .nav-item { width: 100%; display: grid; grid-template-columns: auto 1fr auto; gap: 0 8px; align-items: center; padding: 7px 8px; border: 0; background: none; border-radius: 8px; cursor: pointer; text-align: left; }
  .nav-item:hover { background: var(--panel-2); }
  .nav-item.sel { background: var(--panel-2); font-weight: 600; }
  .nav-item .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nav-item .s { grid-column: 2 / 4; font-size: 12px; color: var(--muted); font-weight: 400; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* Role marker: a straight vertical bar, not part of the rounded button edge. */
  .nav-item.coordinator, .nav-item.worker, .nav-item.solo { position: relative; padding-left: 16px; }
  .nav-item.solo::before { background: var(--info); }
  .nav-item.coordinator::before, .nav-item.worker::before, .nav-item.solo::before { content: ""; position: absolute; left: 4px; top: 7px; bottom: 7px; width: 4px; border-radius: 1px; }
  .nav-item.coordinator::before { background: var(--coord); }
  .nav-item.worker::before { background: var(--worker); }
  .badge { font-size: 11px; min-width: 18px; padding: 0 6px; border-radius: 9px; background: var(--accent); color: #fff; text-align: center; font-weight: 600; }
  .badge.perm { background: var(--err); }
  .side-foot { border-top: 1px solid var(--line); padding: 10px 14px; display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted); }
  .side-foot button { margin-left: auto; border: 1px solid var(--line); background: none; border-radius: 7px; padding: 3px 10px; cursor: pointer; color: var(--muted); }
  .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; background: var(--idle); }
  .dot.ok { background: var(--ok); } .dot.warn { background: var(--warn); } .dot.err { background: var(--err); } .dot.info { background: var(--info); }
  .dot.pulse { animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .3; } }
  #main { min-width: 0; min-height: 0; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; gap: 12px; padding: 10px 18px; border-bottom: 1px solid var(--line); background: var(--panel); min-height: 49px; }
  .topbar h1 { font-size: 15px; margin: 0; display: flex; align-items: center; gap: 8px; min-width: 0; }
  .topbar .sub { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .topbar .right { margin-left: auto; display: flex; gap: 8px; align-items: center; color: var(--muted); font-size: 13px; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { border: 0; background: none; padding: 3px 10px; cursor: pointer; color: var(--muted); }
  .seg button.on { background: var(--panel-2); color: var(--text); font-weight: 600; }
  .menu-btn { display: none; border: 1px solid var(--line); background: none; border-radius: 7px; padding: 2px 9px; cursor: pointer; }
  .role-tag { font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 10px; }
  .role-tag.coordinator { color: var(--coord); background: var(--coord-soft); }
  .role-tag.worker { color: var(--worker); background: var(--worker-soft); }
  .role-tag.solo { color: var(--info); background: color-mix(in srgb, var(--info) 14%, var(--panel)); }
  .pane.solo { border-top-color: var(--info); }
  .pane.solo .pane-head { background: color-mix(in srgb, var(--info) 10%, var(--panel)); }

  /* --- mosaic ------------------------------------------------------------------ */
  /* Columns: as many fixed-minimum-width panes as fit the screen (laptop 2–3,
     ultrawide 4–6), unless the user picks a fixed number. */
  #mosaic { --pane-min: 460px; flex: 1; overflow: auto; padding: 14px; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(var(--pane-min), 100%), 1fr)); gap: 14px; align-content: start; }
  #mosaic.fixed { grid-template-columns: repeat(var(--cols), minmax(0, 1fr)); }
  /* Terminals need more room than chats: fewer, wider panes in "Auto". */
  #mosaic.terms { --pane-min: 520px; }
  #mosaic.leads .pane { height: max(var(--pane-h), min(calc(100vh - 120px), 720px)); }
  .pane .pane-term { flex: 1; min-height: 0; display: flex; flex-direction: column; background: #161513; }
  .pane .pane-term .term-box { flex: 1; min-height: 0; padding: 4px 6px; position: relative; }
  .pane .pane-term .term-box .xterm { height: 100%; }
  .pane .pane-term .term-foot { font-size: 11.5px; padding: 3px 8px; }
  .pane .pane-term .term-foot:empty { display: none; }
  .pane .pane-term.term-focused { box-shadow: inset 0 0 0 2px var(--accent); }
  .team { flex: none; max-height: 38%; overflow: auto; border-top: 1px solid var(--line); padding: 8px 10px; background: var(--panel); }
  .team-sum { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .team-list { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .wchip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 8px; padding: 2px 4px 2px 8px; font-size: 12px; background: var(--panel-2); }
  .wchip .wname { border: 0; background: none; padding: 0; cursor: pointer; font-weight: 600; display: inline-flex; align-items: center; gap: 5px; color: var(--text); }
  .wchip .wst { color: var(--muted); }
  .wchip.idle { border-color: color-mix(in srgb, var(--warn) 55%, var(--line)); background: color-mix(in srgb, var(--warn) 12%, var(--panel-2)); }
  .wchip.waiting { border-color: var(--err); background: color-mix(in srgb, var(--err) 12%, var(--panel-2)); }
  .wchip.offline { opacity: .6; }
  .wchip .give { border: 1px solid var(--line); background: var(--panel); color: var(--text); border-radius: 6px; font-size: 11px; padding: 1px 7px; cursor: pointer; }
  .wchip .give:hover { border-color: var(--accent); }
  .team .addw { font-size: 12px; padding: 1px 8px; }
  .pane { height: var(--pane-h); background: var(--panel); border: 1px solid var(--line); border-radius: 12px; display: flex; flex-direction: column; overflow: hidden; border-top: 4px solid var(--idle); }
  .pane.coordinator { border-top-color: var(--coord); }
  .pane.worker { border-top-color: var(--worker); }
  .pane.attention { box-shadow: 0 0 0 2px var(--err); }
  .pane.offline { opacity: .62; }
  .pane-head { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--line); }
  .pane.coordinator .pane-head { background: var(--coord-soft); }
  .pane.worker .pane-head { background: var(--worker-soft); }
  .pane-head .title { font-weight: 650; border: 0; background: none; padding: 0; cursor: pointer; }
  .pane-head .title:hover { text-decoration: underline; }
  .ctx { font: 11.5px var(--mono); color: var(--muted); border: 1px solid var(--line); border-radius: 10px; padding: 0 7px; white-space: nowrap; }
  .ctx.warm { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 45%, var(--line)); }
  .ctx.hot { color: #fff; background: var(--err); border-color: var(--err); }
  .pane-head .meta { margin-left: auto; color: var(--muted); font-size: 12px; font-family: var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mosaic-empty { grid-column: 1 / -1; color: var(--muted); text-align: center; padding: 60px 20px; }

  /* --- chat (shared by panes and the session view) ---------------------------- */
  .chat { flex: 1; min-height: 0; position: relative; display: flex; flex-direction: column; }
  .scroll { flex: 1; overflow: auto; overscroll-behavior: contain; }
  .items { padding: 12px 14px 18px; display: flex; flex-direction: column; gap: 8px; }
  .full .items { max-width: 860px; margin: 0 auto; padding: 20px 24px 28px; gap: 12px; }
  .older { text-align: center; color: var(--muted); font-size: 12px; padding: 6px; }
  .status { display: flex; align-items: center; gap: 8px; padding: 7px 12px; border-top: 1px solid var(--line); font-size: 12.5px; color: var(--muted); background: var(--panel); min-height: 34px; }
  .full .status { justify-content: center; padding: 10px 16px; font-size: 13.5px; }
  .status .txt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .status.waiting { color: var(--err); font-weight: 600; }
  .jump { position: absolute; bottom: 46px; left: 50%; transform: translateX(-50%); border: 1px solid var(--line); background: var(--panel); border-radius: 16px; padding: 4px 12px; cursor: pointer; font-size: 12.5px; box-shadow: 0 2px 10px rgba(0,0,0,.12); }

  .row-user { align-self: flex-end; max-width: 85%; }
  .bubble { background: var(--bubble); border-radius: 14px 14px 4px 14px; padding: 8px 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .bubble.in { background: var(--bubble-in); }
  .bubble-head { font-size: 11.5px; color: var(--muted); margin: 0 4px 2px; text-align: right; }
  .bubble-head b { color: var(--text); }
  .assistant { overflow-wrap: anywhere; }
  .assistant p { margin: 0 0 .55em; } .assistant p:last-child { margin-bottom: 0; }
  .assistant pre { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; overflow: auto; font: 12.5px/1.45 var(--mono); margin: .4em 0; }
  .assistant pre code { background: none; padding: 0; }
  .assistant ul, .assistant ol { margin: .2em 0 .55em; padding-left: 1.4em; }
  .assistant .h { font-weight: 700; display: block; margin: .5em 0 .2em; }
  .sent { border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 8px; padding: 6px 10px; background: var(--panel); }
  .sent .h { font-size: 11.5px; color: var(--muted); margin-bottom: 2px; }
  .sent .x { white-space: pre-wrap; overflow-wrap: anywhere; }
  .sysline { align-self: center; text-align: center; color: var(--muted); font-size: 12px; max-width: 92%; }
  .sysline.warn { color: var(--warn); }
  .sysline.notice { color: var(--text); background: color-mix(in srgb, var(--warn) 12%, var(--panel)); border: 1px solid color-mix(in srgb, var(--warn) 35%, var(--line)); border-radius: 8px; padding: 6px 10px; font-size: 12.5px; }
  .divider { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 11.5px; margin: 2px 0; }
  .divider::before, .divider::after { content: ""; flex: 1; border-top: 1px dashed var(--line); }

  .tools { border: 1px solid var(--line); border-radius: 10px; background: var(--panel); }
  .tools > summary { list-style: none; cursor: pointer; padding: 6px 10px; display: flex; gap: 8px; align-items: center; font-size: 12.5px; color: var(--muted); }
  .tools > summary::-webkit-details-marker { display: none; }
  .tools > summary::before { content: "▸"; font-size: 10px; }
  .tools[open] > summary::before { content: "▾"; }
  .tools > summary .names { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tools > summary .st { margin-left: auto; white-space: nowrap; }
  .tools .list { border-top: 1px solid var(--line); padding: 4px 0; }
  .tool { padding: 3px 10px; font: 12.5px/1.45 var(--mono); }
  .tool .line { display: flex; gap: 6px; align-items: baseline; }
  .tool .arg { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .tool .tn { font-weight: 700; flex: none; }
  .tool .agent { font-family: system-ui, sans-serif; font-size: 10.5px; color: var(--info); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; flex: none; }
  .res { margin-left: auto; flex: none; font-family: system-ui, sans-serif; font-size: 11.5px; padding-left: 8px; }
  .res.ok { color: var(--ok); } .res.err { color: var(--err); } .res.run { color: var(--warn); }
  .tool details summary { cursor: pointer; color: var(--muted); font: 11.5px system-ui, sans-serif; margin-left: 22px; }
  .tool details pre { margin: 3px 0 4px 22px; padding: 7px 9px; background: var(--panel-2); border-radius: 6px; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 300px; overflow: auto; }
  .t { color: var(--muted); font-size: 11px; font-family: var(--mono); }

  #session { flex: 1; min-height: 0; display: flex; flex-direction: column; }

  /* version + language footers */
  .side-ver, .login-card .foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 11.5px; color: var(--muted); }
  .side-ver { padding: 0 14px 10px; }
  .login-card .foot { margin-top: 16px; }
  .prefs { display: inline-flex; align-items: center; gap: 6px; }
  .login-card .theme-btn, .theme-btn { border: 1px solid var(--line); border-radius: 6px; background: none; padding: 0 6px; cursor: pointer; font-size: 11px; line-height: 18px; width: auto; margin: 0; color: var(--muted); font-weight: 500; }
  .login-card .theme-btn:hover, .theme-btn:hover { background: var(--panel-2); }
  .lang { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .login-card .lang button, .lang button { border: 0; background: none; padding: 1px 7px; cursor: pointer; color: var(--muted); font-size: 11px; width: auto; margin: 0; border-radius: 0; font-weight: 500; }
  .login-card .lang button.on, .lang button.on { background: var(--panel-2); color: var(--text); font-weight: 650; }

  /* actions, menus, dialogs */
  .btn { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 4px 11px; cursor: pointer; color: var(--text); font-size: 13px; white-space: nowrap; }
  .btn:hover { background: var(--panel-2); }
  .btn.danger { color: var(--err); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary.danger { background: var(--err); border-color: var(--err); color: #fff; }
  .more { border: 0; background: none; cursor: pointer; padding: 0 4px; font-size: 16px; line-height: 1; color: var(--muted); border-radius: 6px; }
  .more:hover { background: color-mix(in srgb, var(--text) 8%, transparent); color: var(--text); }
  .menu { position: fixed; z-index: 30; min-width: 190px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 8px 28px rgba(0,0,0,.16); padding: 4px; }
  .menu button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 7px 10px; border-radius: 7px; cursor: pointer; }
  .menu button:hover { background: var(--panel-2); }
  .menu button.danger { color: var(--err); }
  .menu button:disabled { color: var(--muted); cursor: default; background: none; }
  .menu .hint { font-size: 11.5px; color: var(--muted); padding: 2px 10px 6px; }
  .modal-bg { position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.35); display: grid; place-items: center; padding: 16px; }
  .modal { width: min(440px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 20px; box-shadow: 0 12px 40px rgba(0,0,0,.25); }
  .modal h3 { margin: 0 0 8px; font-size: 16px; }
  .modal p { margin: 0 0 16px; color: var(--muted); }
  .modal .err { color: var(--err); font-size: 13px; min-height: 1.2em; margin: -6px 0 10px; }
  .modal .actions { display: flex; justify-content: flex-end; gap: 8px; }

  /* archived */
  #archived { flex: 1; overflow: auto; padding: 18px; }
  .arch-list { max-width: 860px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
  .arch { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; border-left: 4px solid var(--idle); }
  .arch.coordinator { border-left-color: var(--coord); } .arch.worker { border-left-color: var(--worker); }
  .arch .info { flex: 1; min-width: 200px; }
  .arch .info .n { font-weight: 650; display: flex; gap: 8px; align-items: center; }
  .arch .info .m { color: var(--muted); font-size: 12.5px; }
  .arch .acts { display: flex; gap: 6px; flex-wrap: wrap; }
  .nav-sep { border-top: 1px solid var(--line); margin: 10px 6px 4px; }

  /* section tabs (top bar) and the add-machine shortcut (sidebar) */
  .tabs { display: inline-flex; gap: 2px; background: var(--panel-2); padding: 3px; border-radius: 10px; flex: none; }
  .tabs button { border: 0; background: none; padding: 4px 12px; border-radius: 8px; cursor: pointer; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .tabs button:hover { color: var(--text); }
  .tabs button.on { background: var(--panel); color: var(--text); font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
  .tabs .count { font-size: 11px; color: var(--muted); font-weight: 500; }

  .term-row .acts { display: flex; gap: 6px; }

  .term-toast { position: absolute; top: 10px; right: 14px; z-index: 5; background: var(--accent); color: #fff; font-size: 12px; padding: 3px 10px; border-radius: 6px; pointer-events: none; }
  .modal.wide { width: min(680px, 100%); max-height: calc(100vh - 32px); overflow: auto; }

  .steps .check { margin: 4px 0 8px; }
  .steps .manual { margin-top: 8px; font-size: 12.5px; color: var(--muted); }
  .steps .manual summary { cursor: pointer; margin-bottom: 6px; }

  .steps .lbl { font-size: 12px; color: var(--muted); margin: 6px 0 4px; }
  .steps .cmdrow { display: flex; gap: 6px; align-items: flex-start; }
  .steps .cmdrow .cmd { flex: 1; margin: 0 0 6px; }
  .steps .cmdrow .btn { flex: none; padding: 4px 8px; font-size: 12px; }
  .steps .note { font-size: 12px; color: var(--muted); margin: 2px 0 0; }

  .field .hint { font-size: 12px; color: var(--muted); }
  .check { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; margin-bottom: 12px; }
  .check input { margin-top: 3px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
  .cmd { position: relative; background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; font: 12.5px/1.5 var(--mono); white-space: pre-wrap; word-break: break-all; margin: 0 0 10px; }
  .wait { display: flex; align-items: center; gap: 8px; font-size: 13px; margin: 6px 0 14px; }
  /* web terminal */
  #terminal { flex: 1; min-height: 0; display: flex; flex-direction: column; background: #161513; }
  #terminal .term-box { flex: 1; min-height: 0; padding: 6px 8px; position: relative; }

  .term-foot { padding: 6px 14px; font-size: 12px; color: #a29e96; background: #1f1e1c; border-top: 1px solid #393733; display: flex; gap: 10px; align-items: center; }
  .term-foot .ro { color: var(--warn); font-weight: 600; }
  .term-over { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(22,21,19,.82); color: #ecebe7; text-align: center; padding: 20px; z-index: 2; }

  @media (max-width: 900px) {
    .row2 { grid-template-columns: 1fr; }
    #app { grid-template-columns: 1fr; }
    #side { position: fixed; inset: 0 30% 0 0; z-index: 10; transform: translateX(-100%); transition: transform .2s; box-shadow: 4px 0 20px rgba(0,0,0,.2); }
    #side.open { transform: none; }
    .menu-btn { display: inline-block; }
    #mosaic { grid-template-columns: 1fr !important; }
    .seg { display: none; }
    .topbar .sub, .top-div, .tabs .count { display: none; }
    .topbar { flex-wrap: wrap; }
  }
</style>
</head>

      termLoadFailed: 'No se ha podido cargar el componente del terminal (/vendor/xterm.js de este servidor).',
      onHost: h => `en ${h}`,
      back: 'Volver',
      openLink: '¿Abrir este enlace del terminal en una pestaña nueva?',
      kick: 'Desconectar sesión',
      kickTitle: n => `Desconectar ${n}`,
      kickText: who => `Saca ya a ${who} de Squadra y anula su secreto: quien tenga una copia no podrá volver. Úsalo con una sesión que se porte mal o tenga un nombre que no le corresponde. Después podrás archivarla o eliminarla; para volver a usar el nombre, cierra su terminal y ábrela de nuevo desde su máquina (si se abrió desde el panel), o elimínala.`,
      httpWarn: 'Esta dirección es http sin cifrar: las máquinas la rechazan salvo que añadas --insecure, y hazlo solo en una red privada de confianza. Sirve el panel por https.',
    },
  }
  const T = I18N[LANG]
  document.documentElement.lang = LANG

  // ---------------------------------------------------------------------------
  // state
  let token = store.get('squadraToken') ?? store.get('swarmToken')
  // 'auto' (fit the screen) or a fixed number of columns
  let cols = store.get('squadraCols') || store.get('swarmCols') || 'auto'
  // The mosaic shows each session's live terminal (when it has one) or its chat.
  let mosaicMode = store.get('squadraMosaicMode') === 'chats' ? 'chats' : 'terms'
  let mosaicKey = null // what the panes on screen were built for
  const sessions = new Map()      // name -> session view (from server)
  const hosts = new Map()         // host id -> host view (machines running squadra-host)
  let groups = []                  // [{id, members}]
  let serverSkew = 0
  let streamAbort = null
  const unread = new Map()         // name -> count (while not visible)
  const views = new Set()          // live ChatViews

  // ---------------------------------------------------------------------------
  // helpers
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))
  const now = () => Date.now() + serverSkew
  // (One formatter for all: building one per call costs more than the rest of a redraw.)
  const TIME_FMT = new Intl.DateTimeFormat(LOCALE, { hour: '2-digit', minute: '2-digit', hour12: false })
  const hhmm = ms => TIME_FMT.format(new Date(ms))
  const dur = ms => {
    if (ms > 0 && ms < 1000) return `${(ms / 1000).toFixed(1).replace('.', LANG === 'es' ? ',' : '.')} s`
    const s = Math.max(0, Math.round(ms / 1000))
    return s < 60 ? `${s} s` : s < 3600 ? `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}` : `${Math.floor(s / 3600)} h ${Math.floor((s % 3600) / 60)} min`
  }
  const kfmt = v => { const n = Number(v) || 0; return n >= 1000 ? `${Math.round(n / 1000)}k` : String(n) }
  const num = v => (Number.isFinite(Number(v)) ? Number(v) : 0)
  const base = p => String(p ?? '').split('/').filter(Boolean).pop() ?? ''
  const roleOf = name => sessions.get(name)?.role ?? ''

  let streamHelloSeen = false
  async function api(path) {
    const r = await fetch(path, { headers: { Authorization: `Bearer ${token}` } })
    if (r.status === 401) throw Object.assign(new Error('unauthorized'), { status: 401 })
    const j = await r.json().catch(() => ({ ok: false, description: `HTTP ${r.status}` }))
    if (!j.ok) throw Object.assign(new Error(j.description), { status: j.error_code ?? r.status })
    return j.result
  }

  const MAX_VIEW_ITEMS = 600   // per chat view
  const MAX_RENDER_TEXT = 8000 // characters of one text shown
  const MAX_RENDER_TAGS = 600  // HTML tags one formatted text may become
  const MAX_VIEW_HTML = 1_500_000 // characters of markup one chat view draws
  const MAX_VIEW_TAGS = 60_000     // and HTML tags
  const tagsIn = h => { let n = 0; for (let i = h.indexOf('<'); i >= 0; i = h.indexOf('<', i + 1)) n++; return n }
  const MAX_RENDER_DETAIL = 3000 // characters of a tool's input/output, a summary…
  // Escaped and clipped text of an item's field, computed once: a session
  // sending huge events can't make every re-render slow.
  const clipCache = new WeakMap()
  function clipEsc(it, field, max = MAX_RENDER_DETAIL) {
    if (!it || typeof it !== 'object') return ''
    let m = clipCache.get(it)
    if (!m) clipCache.set(it, m = new Map())
    if (!m.has(field)) {
      const t = String(it[field] ?? '')
      m.set(field, esc(t.length > max ? t.slice(0, max) : t) + (t.length > max ? ` <span class="more">${T.moreChars(t.length - max)}</span>` : ''))
    }
    return m.get(field)
  }
  // Markdown of an item, computed once.
  const mdCache = new WeakMap()
  function mdCached(it) {
    if (!mdCache.has(it)) {
      const t = String(it.text ?? '')
      const clipped = t.length > MAX_RENDER_TEXT ? `${t.slice(0, MAX_RENDER_TEXT)}…` : t
      // At most MAX_RENDER_TAGS elements per text: thousands of lines, list
      // items or `code` spans would make every redraw of the view slow, so
      // such a text is shown as plain text (one element) instead.
      const html = md(clipped)
      let tags = 0
      for (let i = html.indexOf('<'); i >= 0 && tags <= MAX_RENDER_TAGS; i = html.indexOf('<', i + 1)) tags++
      mdCache.set(it, tags > MAX_RENDER_TAGS ? `<div style="white-space:pre-wrap">${esc(clipped)}</div>` : html)
    }
    return mdCache.get(it)
  }

  // Small, safe markdown: everything is escaped first, then a few constructs.
  function md(src) {
    const blocks = []
    let text = esc(src).replace(/```([\w-]*)\n([\s\S]*?)```/g, (_, lang, code) => {
      blocks.push(`<pre><code>${code.replace(/\n$/, '')}</code></pre>`)
      return `\u0000${blocks.length - 1}\u0000`
    })
    const inline = s => s
      .replace(/`([^`\n]+)`/g, '<code>$1</code>')
      .replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>')
      .replace(/(^|[^*\w])\*([^*\n]+)\*(?!\w)/g, '$1<em>$2</em>')
      .replace(/\[([^\]\n]{1,200})\]\((https?:\/\/[^\s)<>]{1,2000})\)/g, (m, label, href) => {
        // A link into this dashboard (e.g. straight to a terminal) is shown as text.
        // Judged on the URL as the browser will read it (entities decoded);
        // one with user:password@ in it is never made a link.
        let own = true
        let realHost = ''
        const decode = x => x.replace(/&#39;/g, "'").replace(/&quot;/g, '"').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&amp;/g, '&')
        try {
          const u = new URL(decode(href))
          const bare = h => h.toLowerCase().replace(/\.+(?=:|$)/, '') // "host." is the same host
          own = bare(u.host) === bare(location.host) || !!u.username || !!u.password || /@/.test(href) || u.hash.startsWith('#/')
          // Whenever the text isn't the address itself, the real host goes
          // next to it (a label can pass for another site in many ways).
          const l = decode(label.replace(/<[^>]*>/g, '')).trim()
          // So does a host written with characters that look like others
          // (gіthub.com with a Cyrillic і, a division slash for "/").
          const written = decode(href).replace(/^https?:\/\//i, '').split(/[/?#\\]/)[0].replace(/^[^@]*@/, '')
          if ((l !== decode(href) && l !== u.href) || /[^\x21-\x7e]/.test(written) || /(^|\.)xn--/i.test(u.hostname)) realHost = u.host
        } catch {}
        return own ? `${label} (${href})` : `<a href="${href}" target="_blank" rel="noopener noreferrer">${label}</a>${realHost ? ` <span class="more">(${esc(realHost)})</span>` : ''}`
      })
    // Line by line: runs of "- " / "1. " lines become lists, headings stand
    // alone, other lines join into paragraphs; blank lines end a paragraph.
    const out = []
    let para = [], list = null
    const endPara = () => { if (para.length) out.push(`<p>${para.join('<br>')}</p>`); para = [] }
    const endList = () => { if (list) out.push(`<${list.tag}>${list.items.map(i => `<li>${i}</li>`).join('')}</${list.tag}>`); list = null }
    for (const line of text.split('\n')) {
      const ul = /^\s*[-*+] (.*)$/.exec(line)
      const ol = /^\s*\d+[.)] (.*)$/.exec(line)
      if (ul || ol) {
        endPara()
        const tag = ul ? 'ul' : 'ol'
        if (list && list.tag !== tag) endList()
        if (!list) list = { tag, items: [] }
        list.items.push(inline((ul ?? ol)[1]))
        continue
      }
      endList()
      if (!line.trim()) { endPara(); continue }
      if (/^\u0000\d+\u0000$/.test(line.trim())) { endPara(); out.push(line.trim()); continue }
      if (/^#{1,6} /.test(line)) { endPara(); out.push(`<span class="h">${inline(line.replace(/^#{1,6} /, ''))}</span>`); continue }
      para.push(inline(line))
    }
    endList(); endPara()
    return out.join('').replace(/\u0000(\d+)\u0000/g, (_, i) => blocks[Number(i)])
  }

  // ---------------------------------------------------------------------------
  // session status (sidebar, pane headers, status bars)
  function status(s) {
    if (!s) return { dot: '', text: '' }
    const a = s.activity ?? {}
    if (!s.online) return { dot: '', text: T.offline(s.last_seen_at ? dur(now() - s.last_seen_at * 1000) : '—') }
    switch (a.state) {
      case 'tool': return { dot: 'warn pulse', text: `${a.tool?.name ?? T.tool} · ${dur(now() - (a.tool?.since ?? now()))} · ${a.tool?.summary ?? ''}` }
      case 'working': return { dot: 'ok pulse', text: T.working(dur(now() - (a.since ?? now()))) }
      case 'waiting': return { dot: 'err pulse', waiting: true, text: a.tool ? T.waitingTool(a.tool.name, a.tool.summary ?? '') : T.waitingInput(a.waiting) }
      case 'compacting': return { dot: 'info pulse', text: T.compacting }
      case 'idle': return { dot: 'ok', text: T.idle(dur(now() - (a.since ?? now()))) }
      case 'ended': return { dot: '', text: T.ended }
      default: return { dot: 'ok', text: a.observe === 'off' ? T.connectedNoObs : T.connected }
    }
  }

  const byPresence = (a, b) => (b.online - a.online) || COLLATOR.compare(a.name, b.name)

  // Squads: each coordinator with the workers that report to it. Workers whose
  // coordinator isn't here (or sessions with no role) go in "orphans".
  function squadsOf(list) {
    const coords = list.filter(s => s.role === 'coordinator').sort(byPresence)
    const names = new Set(coords.map(c => c.name))
    return {
      squads: coords.map(c => ({ coord: c, workers: list.filter(s => s.role === 'worker' && s.coordinator === c.name).sort(byPresence) })),
      orphans: list.filter(s => s.role !== 'coordinator' && s.role !== 'solo' && !(s.role === 'worker' && names.has(s.coordinator))).sort(byPresence),
      // Standalone sessions: each on its own, outside every squad.
      solos: list.filter(s => s.role === 'solo').sort(byPresence),
    }
  }

  function sortedSessions({ archived = false } = {}) {
    const list = [...sessions.values()].filter(s => !s.deleted && !!s.archived_at === archived)
    const { squads, orphans, solos } = squadsOf(list)
    return [...squads.flatMap(q => [q.coord, ...q.workers]), ...orphans, ...solos]
  }

  // Which squads are unfolded in the sidebar (remembered per browser).
  const squadOpen = (() => { try { return JSON.parse(store.get('squadraSquads') || '{}') } catch { return {} } })()

  // ---------------------------------------------------------------------------
  // ChatView: one session's conversation. Used by mosaic panes and the full view.
  class ChatView {
    constructor(name, { full = false } = {}) {
      this.name = name
      this.full = full
      this.items = []           // sorted by ts
      this.keys = new Set()     // de-dup
      this.nextBefore = null
      this.hasMore = true
      this.loading = false
      this.unseen = 0
      this.openGroups = new Map() // group key -> user choice
      this.el = document.createElement('div')
      this.el.className = 'chat'
      this.el.innerHTML = `<div class="scroll"><div class="items"></div></div><button class="jump" hidden>${T.jump(0)}</button><div class="status"><span class="dot"></span><span class="txt"></span></div>`
      this.scrollEl = this.el.querySelector('.scroll')
      this.itemsEl = this.el.querySelector('.items')
      this.jumpEl = this.el.querySelector('.jump')
      this.scrollEl.addEventListener('scroll', () => this.onScroll())
      this.jumpEl.addEventListener('click', () => this.toBottom())
      this.itemsEl.addEventListener('toggle', e => {
        const d = e.target
        if (d.classList?.contains('tools')) this.openGroups.set(d.dataset.g, d.open)
      }, true)
      views.add(this)
      this.renderStatus()
      this.loadOlder(true)
    }

    destroy() { views.delete(this) }

    // The chat was cleared on the server: start over.
    reset() {
      // A page still on its way belongs to the view before the reset: ignored.
      this.gen = (this.gen ?? 0) + 1
      this.loading = false
      this.gapAfter = false
      this.items = []
      this.keys = new Set()
      this.nextBefore = null
      this.hasMore = true
      this.unseen = 0
      this.jumpEl.hidden = true
      this.render()
      this.loadOlder(true)
    }

    key(it) { return it.t === 'message' ? `m${it.id}` : `e${it.id}` }

    // older: these items come from scrolling up (they are the oldest ones).
    add(list, { live = false, older = false } = {}) {
      let added = 0
      // What arrives live goes at the end, whatever time the session put on
      // it (an event dated in the past must not slip in above, unseen); the
      // time shown is still its own. A reload orders everything by time.
      let last = this.items.length ? this.items[this.items.length - 1] : null
      for (const it of list) {
        const k = this.key(it)
        if (this.keys.has(k)) continue
        this.keys.add(k)
        if (live && last) it.order = Math.max(it.ts, last.order ?? last.ts)
        this.items.push(it)
        if (live) last = it
        added++
      }
      if (!added) return 0
      this.items.sort((a, b) => (a.order ?? a.ts) - (b.order ?? b.ts) || (a.id ?? 0) - (b.id ?? 0))
      // Keep the view bounded. Scrolling up drops the newest items (the
      // "jump" button loads the latest again); new items drop the oldest
      // (scrolling up loads them again).
      if (this.items.length > MAX_VIEW_ITEMS) {
        // Reading back (scrolled up, or a page on its way): new items don't
        // push the old ones out from under the reader; they wait behind the
        // jump button.
        if (older || (live && (this.loading || !this.atBottom()))) {
          const drop = this.items.splice(MAX_VIEW_ITEMS)
          for (const it of drop) this.keys.delete(this.key(it))
          this.gapAfter = true
          this.jumpEl.hidden = false
          this.jumpEl.textContent = T.jump(this.unseen)
        } else {
          const drop = this.items.splice(0, this.items.length - MAX_VIEW_ITEMS)
          for (const it of drop) this.keys.delete(this.key(it))
          // Scrolling up continues from the newest item dropped (by its own
          // time): nothing between it and what is shown is skipped, whatever
          // times a session put on its events (repeats are de-duplicated).
          // (In the server's order: time, then events before messages, then id.)
          const rank = x => (x.t === 'event' ? 1 : 0)
          const c = drop.reduce((a, b) => (b.ts > a.ts || (b.ts === a.ts && (rank(b) > rank(a) || (rank(b) === rank(a) && (b.id ?? 0) > (a.id ?? 0)))) ? b : a))
          // (+1: the server returns what is strictly older, and c must come back too.)
          this.nextBefore = `${c.ts}:${c.t === 'event' ? 1 : 0}:${c.id + 1}`
          this.evictions = (this.evictions ?? 0) + 1
          this.hasMore = true
        }
      }
      if (live && !this.atBottom()) { this.unseen += added; this.jumpEl.hidden = false; this.jumpEl.textContent = T.jump(this.unseen) }
      return added
    }

    accepts(it) {
      if (it.t === 'event') return it.session === this.name
      if (it.from === this.name || it.target === this.name) return true
      return it.target?.startsWith('#') && groups.some(g => g.id === it.target && g.members.includes(this.name))
    }

    atBottom() { return this.scrollEl.scrollHeight - this.scrollEl.scrollTop - this.scrollEl.clientHeight < 60 }
    toBottom() {
      // Newer items were dropped while reading back: load the latest again.
      if (this.gapAfter) return this.reset()
      this.scrollEl.scrollTop = this.scrollEl.scrollHeight; this.unseen = 0; this.jumpEl.hidden = true
    }

    onScroll() {
      if (this.atBottom() && !this.gapAfter) { this.unseen = 0; this.jumpEl.hidden = true }
      if (this.scrollEl.scrollTop < 80) this.loadOlder()
    }

    async loadOlder(first = false) {
      if (this.loading || !this.hasMore) return
      this.loading = true
      const gen = this.gen // a reset() meanwhile makes this answer stale
      const evicted = this.evictions ?? 0 // and live items dropped meanwhile set their own cursor
      try {
        const q = `/api/timeline?session=${encodeURIComponent(this.name)}&limit=${this.full ? 200 : 120}${this.nextBefore != null ? `&before=${this.nextBefore}` : ''}`
        const r = await api(q)
        if (gen !== this.gen) return
        // Live items were dropped while this page was on its way: the page
        // would leave a hole above them. Dropped; the next scroll asks again
        // from the right place.
        if ((this.evictions ?? 0) !== evicted) { this.hasMore = true; this.render(); return }
        this.nextBefore = r.next_before
        this.hasMore = r.has_more && r.items.length > 0
        const fromBottom = this.scrollEl.scrollHeight - this.scrollEl.scrollTop
        this.add(r.items, { older: !first })
        this.render()
        if (first) this.toBottom()
        else this.scrollEl.scrollTop = this.scrollEl.scrollHeight - fromBottom // keep the reader in place
      } catch (e) {
        if (e.status === 401) return showLogin(T.tokenInvalid)
        // The server refused the request: don't ask again on every scroll.
        if (e.status >= 400 && e.status < 500) { this.hasMore = false; this.render() }
      } finally {
        if (gen === this.gen) this.loading = false
      }
    }

    live(it) {
      if (!this.accepts(it)) return false
      if (this.gapAfter) {
        // Reading far back: count it; the jump button loads the latest.
        if (this.keys.has(this.key(it))) return false
        this.unseen++
        this.jumpEl.textContent = T.jump(this.unseen)
        return true
      }
      const stick = this.atBottom()
      if (!this.add([it], { live: true })) return false
      this.scheduleRender(stick)
      return true
    }

    // A burst of changes re-renders once per frame, not once per change.
    scheduleRender(stick = false) {
      this.stick = this.stick || stick
      if (!this.frame) {
        this.frame = requestAnimationFrame(() => {
          this.frame = null
          this.render()
          if (this.stick) this.toBottom()
          this.stick = false
        })
      }
    }

    // --- rendering ---------------------------------------------------------------
    render() {
      const html = []
      if (this.hasMore) html.push(`<div class="older">${this.loading ? T.loading : T.scrollMore}</div>`)
      else {
        const cleared = sessions.get(this.name)?.cleared_at
        const when = cleared ? new Date(cleared).toLocaleString(LOCALE, { dateStyle: 'short', timeStyle: 'short' }) : ''
        if (this.items.length === 0) html.push(`<div class="older">${cleared ? T.clearedEmpty(when) : T.noActivity}</div>`)
        else html.push(`<div class="older">${cleared ? T.clearedTop(when) : T.historyStart}</div>`)
      }

      const a = sessions.get(this.name)?.activity
      const parts = []
      let group = null
      const flush = () => { if (group) { parts.push({ group, n: group.list.length }); group = null } }
      for (const it of this.items) {
        if (it.t === 'event' && (it.kind === 'tool_start' || it.kind === 'tool_end' || it.kind === 'subagent_start' || it.kind === 'subagent_stop')) {
          if (!group) group = { key: this.key(it), list: [] }
          group.list.push(it)
          continue
        }
        if (it.t === 'event' && (it.kind === 'usage' || (it.kind === 'prompt' && it.channel))) continue
        flush()
        parts.push({ it, n: 1 })
      }
      flush()
      // At most MAX_VIEW_HTML of markup (and MAX_VIEW_TAGS tags) per redraw,
      // newest first: a session can't make every redraw of its view parse
      // megabytes (escaping can multiply a text's size). Older items are left
      // out, and say so; a group of tools too big for what is left shows its
      // newest tools.
      const left = { chars: MAX_VIEW_HTML, tags: MAX_VIEW_TAGS }
      const shown = []
      let hidden = 0
      for (let i = parts.length - 1; i >= 0; i--) {
        const p = parts[i]
        const h = p.group ? this.renderGroup(p.group, a, left) : this.renderItem(p.it)
        const tags = tagsIn(h)
        if (h.length > left.chars || tags > left.tags) { for (let j = 0; j <= i; j++) hidden += parts[j].n; break }
        shown.push(h)
        left.chars -= h.length
        left.tags -= tags
      }
      if (hidden) html.push(`<div class="older">${T.olderHidden(hidden)}</div>`)
      this.itemsEl.innerHTML = html.join('') + shown.reverse().join('')
    }

    renderItem(it) {
      if (it.t === 'message') {
        const file = it.file ? `${it.text ? '\n' : ''}📎 ${esc(it.file.name)}` : ''
        if (it.system) return `<div class="sysline notice">${esc(it.text)}<div class="t">${hhmm(it.ts)} · ${T.serverNotice}</div></div>`
        if (it.from === this.name) {
          return `<div class="sent"><div class="h">→ <b>${esc(it.target)}</b> · ${hhmm(it.ts)}${it.edited_at ? ` · ${T.editedMark}` : ''}</div><div class="x">${clipEsc(it, 'text', MAX_RENDER_TEXT)}${file}</div></div>`
        }
        return `<div class="row-user"><div class="bubble-head"><b>${esc(it.from)}</b>${it.target.startsWith('#') ? T.inGroup(esc(it.target)) : ''} · ${hhmm(it.ts)}${it.edited_at ? ` · ${T.editedMark}` : ''}</div><div class="bubble in">${clipEsc(it, 'text', MAX_RENDER_TEXT)}${file}</div></div>`
      }
      switch (it.kind) {
        case 'prompt': return `<div class="row-user"><div class="bubble-head"><b>${T.you}</b> · ${hhmm(it.ts)}</div><div class="bubble">${clipEsc(it, 'text', MAX_RENDER_TEXT)}</div></div>`
        case 'text': return `<div class="assistant">${mdCached(it)}</div>`
        case 'stop': return `<div class="divider">${T.turnEnded} · ${hhmm(it.ts)}${num(it.background_tasks) ? ` · ${T.background(num(it.background_tasks))}` : ''}</div>`
        case 'notification': return `<div class="sysline warn">⏳ ${it.text ? clipEsc(it, 'text', 500) : esc(it.type)} · ${hhmm(it.ts)}</div>`
        case 'compact': return `<div class="sysline">${T.compactingLine} · ${hhmm(it.ts)}</div>`
        case 'compacted': return `<div class="sysline">${T.compactedLine(it.trigger !== 'manual')} · ${hhmm(it.ts)}${it.summary ? `<details style="text-align:left"><summary>${T.compactSummary}</summary><pre style="white-space:pre-wrap;font:12px/1.4 var(--mono);background:var(--panel-2);padding:8px;border-radius:6px;max-height:300px;overflow:auto">${clipEsc(it, 'summary', MAX_RENDER_TEXT)}</pre></details>` : ''}</div>`
        case 'session_start': return `<div class="sysline">${T.sessionStarted(it.source === 'resume')}${it.cwd ? T.inDir(esc(it.cwd)) : ''} · ${hhmm(it.ts)}</div>`
        case 'session_end': return `<div class="sysline">${T.sessionEnded}${it.reason ? ` (${esc(it.reason)})` : ''} · ${hhmm(it.ts)}</div>`
        case 'observe_start': return `<div class="sysline">${T.observing(esc(it.level))} · ${hhmm(it.ts)}</div>`
        default: return ''
      }
    }

    renderGroup(group, activity, left = { chars: Infinity, tags: Infinity }) {
      // Pair tool_start/tool_end by tool use id.
      const tools = []
      const byId = new Map()
      for (const ev of group.list) {
        if (ev.kind === 'tool_start') { const t = { start: ev, end: null }; tools.push(t); if (ev.ref) byId.set(ev.ref, t) }
        else if (ev.kind === 'tool_end') { const t = ev.ref && byId.get(ev.ref); if (t) t.end = ev; else tools.push({ start: { ...ev, summary: '' }, end: ev }) }
        else tools.push({ sub: ev })
      }
      const real = tools.filter(t => !t.sub)
      const running = real.filter(t => !t.end)
      const failed = real.filter(t => t.end && t.end.ok === false)
      const names = [...new Set(real.map(t => toolName(t.start.tool)))]
      const waitingId = activity?.state === 'waiting' ? activity.tool?.id : null
      const st = running.length
        ? (running.some(t => t.start.ref === waitingId) ? `<span class="res err">${T.waitingPermission}</span>` : `<span class="res run">⏳ ${T.running(running.length)}</span>`)
        : failed.length ? `<span class="res err">✗ ${T.withErrors(failed.length)}</span>` : '<span class="res ok">✓</span>'
      const userChoice = this.openGroups.get(group.key)
      const open = userChoice ?? (running.length > 0)
      // Newest tools first, as many as fit in what the view has left.
      const rows = []
      let chars = left.chars - 4000, tags = left.tags - 40, k = tools.length
      for (; k > 0; k--) {
        const t = tools[k - 1]
        const row = t.sub ? `<div class="tool"><div class="line">🤖 <span class="arg">${T.subagent(t.sub.kind === 'subagent_start')}</span></div>${t.sub.text ? `<details><summary>${T.result}</summary><pre>${clipEsc(t.sub, 'text')}</pre></details>` : ''}</div>` : this.renderTool(t, waitingId)
        const n = tagsIn(row)
        if (row.length > chars || n > tags) break
        rows.push(row)
        chars -= row.length
        tags -= n
      }
      if (k) rows.push(`<div class="tool"><div class="line"><span class="arg">${T.olderHidden(k)}</span></div></div>`)
      rows.reverse()
      return `<details class="tools" data-g="${group.key}"${open ? ' open' : ''}>
        <summary><span>🔧</span><span class="names">${T.tools(real.length)} · ${esc(names.join(', '))}</span><span class="st">${st}</span></summary>
        <div class="list">${rows.join('')}</div></details>`
    }

    renderTool({ start, end }, waitingId) {
      let res
      if (!end && start.ref === waitingId) res = `<span class="res err">${T.permShort}</span>`
      else if (!end) res = `<span class="res run" data-since="${start.ts}">⏳ ${dur(now() - start.ts)}</span>`
      else if (end.ok === false) res = `<span class="res err">✗ ${end.interrupted ? T.interrupted : end.summary ? clipEsc(end, 'summary', 300) : T.error}${end.duration_ms ? ` · ${dur(end.duration_ms)}` : ''}</span>`
      else res = `<span class="res ok">✓${end.summary ? ` ${clipEsc(end, 'summary', 300)}` : ''}${end.duration_ms ? ` · ${dur(end.duration_ms)}` : ''}</span>`
      const det = []
      if (start.detail) det.push(`<details><summary>${T.input}</summary><pre>${clipEsc(start, 'detail')}</pre></details>`)
      if (end?.detail) det.push(`<details><summary>${end.ok === false ? T.error : T.output}</summary><pre>${clipEsc(end, 'detail')}</pre></details>`)
      const sum = clipEsc(start, 'summary', 300)
      const tip = esc(String(start.summary ?? '').slice(0, 300)) // an attribute: plain text only
      return `<div class="tool"><div class="line"><span>${toolIcon(start.tool)}</span><span class="tn">${esc(toolName(start.tool))}</span>${start.agent ? `<span class="agent">${esc(start.agent)}</span>` : ''}<span class="arg" title="${tip}">${sum}</span>${res}</div>${det.join('')}</div>`
    }

    renderStatus() {
      const s = sessions.get(this.name)
      const st = status(s)
      const bar = this.el.querySelector('.status')
      bar.classList.toggle('waiting', !!st.waiting)
      bar.querySelector('.dot').className = `dot ${st.dot}`
      bar.querySelector('.txt').textContent = st.text
      bar.querySelector('.txt').title = st.text
    }

    tick() {
      for (const el of this.itemsEl.querySelectorAll('.res.run[data-since]')) el.textContent = `⏳ ${dur(now() - Number(el.dataset.since))}`
      this.renderStatus()
    }
  }

  const ICON = { Bash: '⚙️', Read: '📖', Write: '✏️', Edit: '✏️', MultiEdit: '✏️', NotebookEdit: '✏️', Grep: '🔎', Glob: '🔎', WebFetch: '🌐', WebSearch: '🌐', Task: '🤖', Agent: '🤖', TodoWrite: '📋', Skill: '🧩' }
  const toolIcon = t => (Object.hasOwn(ICON, t) ? ICON[t] : String(t).startsWith('mcp__') ? '🔌' : '🔧')
  const toolName = t => String(t ?? '').startsWith('mcp__') ? String(t).split('__').slice(1).join(' › ') : (t ?? '')

  // ---------------------------------------------------------------------------
  // sidebar
  const isMachines = r => r.view === 'hosts' || r.view === 'terminal'

  function renderTabs() {
    const r = currentRoute()
    const list = sortedSessions()
    const hostList = [...hosts.values()]
    const tab = (on, go, icon, label, count) => `<button role="tab" aria-selected="${on}" class="${on ? 'on' : ''}" data-go="${go}"><span>${icon}</span>${label}<span class="count">${count}</span></button>`
    setHtml($('tabs'), tab(!isMachines(r), '#/', '▦', T.tabSessions, `${list.filter(s => s.online).length}/${list.length}`) +
      tab(isMachines(r), '#/hosts', '🖥️', T.machines, `${hostList.filter(h => h.online).length}/${hostList.length}`))
  }

  // What a burst of stream changes redraws, once per frame (hundreds of
  // sessions changing at once would otherwise redraw the sidebar hundreds of
  // times).
  const pending = new Set()
  function soon(fn) {
    if (!pending.size) requestAnimationFrame(() => { const fns = [...pending]; pending.clear(); for (const f of fns) f() })
    pending.add(fn)
  }

  // Rewritten only when what it shows changed: a rewrite every second would
  // drop keyboard focus, open menus and clicks in progress.
  // When only texts and attributes changed (a duration ticking, a dot's
  // colour) they are patched in place, so focus and hover stay put too.
  function setHtml(el, html) {
    if (!el || el._html === html) return
    const t = document.createElement('template')
    t.innerHTML = html
    if (el._html === undefined || !patch(el, t.content)) el.innerHTML = html
    el._html = html
  }
  function patch(a, b) {
    const x = a.childNodes, y = b.childNodes
    if (x.length !== y.length) return false
    for (let i = 0; i < x.length; i++) {
      const m = x[i], n = y[i]
      if (m.nodeType !== n.nodeType || m.nodeName !== n.nodeName) return false
      if (m.nodeType === 3) { if (m.data !== n.data) m.data = n.data; continue }
      if (m.nodeType !== 1) continue
      for (const at of [...m.attributes]) if (!n.hasAttribute(at.name)) m.removeAttribute(at.name)
      for (const at of n.attributes) if (m.getAttribute(at.name) !== at.value) m.setAttribute(at.name, at.value)
      if (!patch(m, n)) return false
    }
    return true
  }
  function renderNav() {
    const route = currentRoute()
    renderTabs()
    if (isMachines(route)) return renderMachinesNav(route)
    const list = sortedSessions()
    const online = list.filter(s => s.online).length
    let html = `<button class="nav-item ${route.view === 'mosaic' && !route.squad ? 'sel' : ''}" data-go="#/"><span>▦</span><span class="n">${T.allSessions}</span><span class="badge" hidden></span><span class="s">${T.activeOf(online, list.length)}</span></button>`
    const leadsN = list.filter(s => s.role === 'coordinator').length
    html += `<button class="nav-item ${route.view === 'leads' ? 'sel' : ''}" data-go="#/c"><span>🧭</span><span class="n">${T.leads}</span><span class="badge" hidden></span><span class="s">${T.leadsCount(leadsN)}</span></button>`
    const item = s => {
      const st = status(s)
      const n = unread.get(s.name) ?? 0
      const badge = st.waiting ? '<span class="badge perm">🔐</span>' : n ? `<span class="badge">${n > 99 ? '99+' : n}</span>` : '<span></span>'
      return `<button class="nav-item ${s.role ?? ''} ${route.view === 'session' && route.name === s.name ? 'sel' : ''}" data-go="#/s/${encodeURIComponent(s.name)}" title="${esc(st.text)}">
        <span class="dot ${st.dot}"></span><span class="n">${esc(s.name)}</span>${badge}<span class="s">${esc(st.text)}</span></button>`
    }
    const { squads, orphans, solos } = squadsOf(list)
    if (squads.length) html += `<div class="nav-label">${T.squads}</div>`
    for (const { coord, workers } of squads) {
      const here = route.view === 'session' && workers.some(w => w.name === route.name)
      // (Opened when you go to one of its workers — see route() —, and then
      // folded or unfolded as you like.)
      const open = Object.hasOwn(squadOpen, coord.name) && squadOpen[coord.name] === true
      const on = workers.filter(w => w.online).length
      // Folded: the count chip also carries what needs attention inside.
      const waiting = workers.some(w => status(w).waiting)
      const unseen = workers.reduce((t, w) => t + (unread.get(w.name) ?? 0), 0)
      const alert = open ? '' : waiting ? '<span class="badge perm">🔐</span>' : unseen ? `<span class="badge">${unseen > 99 ? '99+' : unseen}</span>` : ''
      const squadOn = route.view === 'mosaic' && route.squad === coord.name
      html += `<div class="squad ${open ? 'open' : ''} ${here || squadOn || (route.view === 'session' && route.name === coord.name) ? 'sel-in' : ''}">
        <div class="squad-head">${item(coord)}<button class="squad-mosaic ${squadOn ? 'on' : ''}" data-go="#/q/${encodeURIComponent(coord.name)}" title="${esc(T.viewSquadTitle(coord.name))}" aria-label="${esc(T.viewSquadTitle(coord.name))}">▦</button><button class="squad-toggle" data-squad="${esc(coord.name)}" title="${esc(`${T.squadToggle(workers.length, open)} · ${T.squadCount(on, workers.length)}`)}" aria-expanded="${open}"><span>👥 ${workers.length ? `${on}/${workers.length}` : '0'}</span>${alert}<span class="chev">▸</span></button></div>
        <div class="squad-body">${workers.length ? workers.map(item).join('') : `<div class="squad-empty">${T.noWorkers}</div>`}</div>
      </div>`
    }
    if (orphans.length) html += `<div class="nav-label">${squads.length ? T.noCoordinator : T.workers}</div>${orphans.map(item).join('')}`
    if (solos.length) html += `<div class="nav-label">${T.standalone}</div>${solos.map(item).join('')}`
    const archivedCount = sortedSessions({ archived: true }).length
    html += `<div class="nav-sep"></div><button class="nav-item ${route.view === 'archived' ? 'sel' : ''}" data-go="#/archived"><span>🗄️</span><span class="n">${T.archived}</span><span class="badge" style="background:var(--idle)" ${archivedCount ? '' : 'hidden'}>${archivedCount}</span><span class="s">${T.archivedCount(archivedCount)}</span></button>`
    setHtml($('nav'), html)
  }

  // Machines sidebar: every machine, with the sessions opened on it.
  function renderMachinesNav(route) {
    const list = [...hosts.values()].sort((a, b) => (b.online - a.online) || COLLATOR.compare(a.name, b.name))
    let html = `<button class="nav-item ${route.view === 'hosts' && !route.host ? 'sel' : ''}" data-go="#/hosts"><span>🖥️</span><span class="n">${T.allMachines}</span><span></span><span class="s">${T.machinesCount(list.filter(h => h.online).length, list.length)}</span></button>`
    if (list.length) html += `<div class="nav-label">${T.machines}</div>`
    for (const h of list) {
      const terms = h.info?.terminals ?? []
      const sub = h.online ? `${T.hostOnline} · ${T.hostSessions(terms.length)}` : hostState(h)
      html += `<button class="nav-item ${route.view === 'hosts' && route.host === h.id ? 'sel' : ''}" data-go="#/h/${encodeURIComponent(h.id)}" title="${esc(sub)}">
        <span class="dot ${h.online ? 'ok' : ''}"></span><span class="n">${esc(h.name)}</span><span></span><span class="s">${esc(sub)}</span></button>`
      if (!h.online) continue
      for (const t of terms) {
        const s = sessionOn(h.id, t.id)
        const st = s ? status(s) : { dot: '', text: '' }
        html += `<button class="nav-item sub ${t.role ?? ''} ${route.view === 'terminal' && route.host === h.id && route.term === t.id ? 'sel' : ''}" data-go="#/t/${encodeURIComponent(h.id)}/${encodeURIComponent(t.id)}" title="${esc(st.text)}">
          <span class="dot ${st.dot}"></span><span class="n">⌨ ${esc(t.name)}</span>${st.waiting ? '<span class="badge perm">🔐</span>' : '<span></span>'}</button>`
      }
    }
    setHtml($('nav'), html)
  }

  $('tabs').addEventListener('click', e => {
    const b = e.target.closest('[data-go]')
    if (b) location.hash = b.dataset.go
  })
  $('addHostBtn').addEventListener('click', () => {
    $('side').classList.remove('open')
    if (!isMachines(currentRoute())) location.hash = '#/hosts'
    addMachineDialog()
  })

  $('nav').addEventListener('click', e => {
    const t = e.target.closest('[data-squad]')
    if (t) {
      const name = t.dataset.squad
      squadOpen[name] = !t.closest('.squad').classList.contains('open')
      store.set('squadraSquads', JSON.stringify(squadOpen))
      return renderNav()
    }
    const b = e.target.closest('[data-go]')
    if (!b) return
    location.hash = b.dataset.go
    $('side').classList.remove('open')
  })
  $('menuBtn').addEventListener('click', () => $('side').classList.toggle('open'))

  // ---------------------------------------------------------------------------
  // views
  let mosaicPanes = new Map() // name -> {pane, view}
  let sessionView = null

  const dec = v => { try { return decodeURIComponent(v) } catch { return v } }
  // Set once the user moves around the dashboard (not on the page it opened on).
  let navigatedInApp = false
  // (A real click or key here, not a URL change made from outside.)
  // (Inside the app itself: typing the token on the login page doesn't count.)
  for (const ev of ['click', 'keydown']) document.addEventListener(ev, e => { if (e.isTrusted && !$('app').hidden && e.target.closest?.('#app')) navigatedInApp = true }, true)

  // Names in the address are only ever session names and machine ids: any
  // other text (a crafted link) goes to the main view, never into the header.
  const ROUTE_NAME = /^[A-Za-z0-9_-]{1,32}$/
  const ROUTE_ID = /^[A-Za-z0-9_-]{1,64}$/
  function currentRoute() {
    if (location.hash === '#/archived') return { view: 'archived' }
    if (location.hash === '#/hosts') return { view: 'hosts' }
    if (location.hash === '#/c') return { view: 'leads' }
    const q = location.hash.match(/^#\/q\/(.+)$/)
    if (q) return ROUTE_NAME.test(dec(q[1])) ? { view: 'mosaic', squad: dec(q[1]) } : { view: 'mosaic' }
    const h = location.hash.match(/^#\/h\/(.+)$/)
    if (h) return ROUTE_ID.test(dec(h[1])) ? { view: 'hosts', host: dec(h[1]) } : { view: 'hosts' }
    const t = location.hash.match(/^#\/t\/([^/]+)\/(.+)$/)
    if (t) return ROUTE_ID.test(dec(t[1])) && ROUTE_NAME.test(dec(t[2])) ? { view: 'terminal', host: dec(t[1]), term: dec(t[2]) } : { view: 'hosts' }
    // A session: its live terminal when it has one (opened on a machine
    // from here), else its chat; ".../chat" always the chat.
    const sc = location.hash.match(/^#\/s\/([^/]+)\/chat$/)
    if (sc) return ROUTE_NAME.test(dec(sc[1])) ? { view: 'session', name: dec(sc[1]), chat: true } : { view: 'mosaic' }
    const m = location.hash.match(/^#\/s\/(.+)$/)
    return m && ROUTE_NAME.test(dec(m[1])) ? { view: 'session', name: dec(m[1]) } : { view: 'mosaic' }
  }
  // The terminal a session view shows (null: its chat).
  const sessionTerm = r => (r.view === 'session' && !r.chat ? terminalOf(r.name) : null)

  // The Squadra session behind a machine's terminal: only one that machine
  // opened (a machine could list any name; it can't make it its own).
  function sessionOn(hostId, term) {
    const s = sessions.get(term)
    return s && s.host_id === hostId ? s : null
  }

  function roleTag(role) {
    return role ? `<span class="role-tag ${role}">${role === 'coordinator' ? T.roleCoordinator : role === 'solo' ? T.roleSolo : T.roleWorker}</span>` : ''
  }

  function renderTop() {
    const r = currentRoute()
    if (r.view === 'leads') {
      const cs = sortedSessions().filter(s => s.role === 'coordinator')
      const ws = sortedSessions().filter(s => s.role !== 'coordinator' && cs.some(c => c.name === s.coordinator))
      setHtml($('topTitle'), `🧭 ${T.leads}`)
      $('topSub').textContent = T.leadsSub(cs.length, ws.length)
      setHtml($('topRight'), `<span>${T.columns}</span><span class="seg" id="colsSeg">${['auto', '1', '2', '3', '4'].map(n => `<button data-c="${n}" class="${n === cols ? 'on' : ''}">${n === 'auto' ? T.auto : n}</button>`).join('')}</span>`)
      return
    }
    if (r.view === 'mosaic') {
      const modeSeg = `<span class="seg" id="modeSeg">${['terms', 'chats'].map(m => `<button data-mode="${m}" class="${m === mosaicMode ? 'on' : ''}">${m === 'terms' ? T.modeTerms : T.modeChats}</button>`).join('')}</span>`
      const colsSeg = `${modeSeg}<span>${T.columns}</span><span class="seg" id="colsSeg">${['auto', '2', '3', '4', '5', '6'].map(n => `<button data-c="${n}" class="${n === cols ? 'on' : ''}">${n === 'auto' ? T.auto : n}</button>`).join('')}</span>`
      if (r.squad) {
        const c = sessions.get(r.squad)
        const ws = sortedSessions().filter(s => s.role !== 'coordinator' && s.coordinator === r.squad)
        setHtml($('topTitle'), `<span class="dot ${c ? status(c).dot : ''}"></span>👥 ${esc(T.squadOf(r.squad))}`)
        $('topSub').textContent = T.squadCount(ws.filter(w => w.online).length, ws.length)
        setHtml($('topRight'), `${colsSeg}<button class="btn" data-addworker="${esc(r.squad)}" title="${esc(T.addWorkerTo(r.squad))}">${T.addWorker}</button><button class="btn" data-go="#/">${T.backAll}</button>`)
        return
      }
      setHtml($('topTitle'), T.allSessions)
      $('topSub').textContent = ''
      setHtml($('topRight'), colsSeg)
    } else if (r.view === 'hosts') {
      const h = r.host && hosts.get(r.host)
      setHtml($('topTitle'), h ? `<span class="dot ${h.online ? 'ok' : ''}"></span>${esc(h.name)}` : T.allMachines)
      $('topSub').textContent = h ? hostLine(h) : T.machinesSub
      setHtml($('topRight'), `<button class="btn" data-hact="add">${T.addMachine}</button><button class="btn primary" data-hact="new">${T.newSession}</button>`)
    } else if (r.view === 'terminal') {
      const h = hosts.get(r.host)
      const t = h?.info?.terminals?.find(x => x.id === r.term)
      const s = sessionOn(r.host, r.term)
      setHtml($('topTitle'), `<span class="dot ${s ? status(s).dot : ''}"></span>⌨ ${esc(r.term)} ${roleTag(s?.role ?? t?.role)}`)
      $('topSub').textContent = [h ? T.onHost(h.name) : '', t?.folder ?? '', h?.info && !t ? T.notListed : ''].filter(Boolean).join(' · ')
      const acts = []
      if (s) acts.push(`<button class="btn" data-go="#/s/${encodeURIComponent(r.term)}">${T.chat}</button>`)
      acts.push(`<button class="btn" data-tact="redraw">${T.redraw}</button>`)
      if (t && h?.online) acts.push(`<button class="btn danger" data-tact="kill">${T.closeSession}</button>`)
      acts.push(`<button class="btn" data-go="#/h/${encodeURIComponent(r.host)}">${T.back}</button>`)
      setHtml($('topRight'), acts.join(''))
    } else if (r.view === 'archived') {
      setHtml($('topTitle'), T.archivedTitle)
      $('topSub').textContent = T.archivedSub
      setHtml($('topRight'), `<button class="btn" data-go="#/">${T.backAll}</button>`)
    } else {
      const s = sessions.get(r.name)
      const a = s?.activity ?? {}
      setHtml($('topTitle'), `<span class="dot ${status(s).dot}"></span>${esc(r.name)} ${roleTag(s?.role)}${s?.archived_at ? ` <span class="role-tag" style="background:var(--panel-2);color:var(--muted)">${T.archivedTag}</span>` : ''}`)
      $('topSub').textContent = [a.cwd, a.context_tokens ? T.context(kfmt(a.context_tokens)) + (a.context_pct != null ? ` (${T.contextPct(a.context_pct)})` : '') : '', s?.role === 'worker' && s.coordinator ? T.coordinatorOf(s.coordinator) : ''].filter(Boolean).join(' · ')
      const acts = []
      const where = terminalOf(r.name)
      if (where && !r.chat) {
        // Its terminal on screen: the chat a click away, and the terminal's own actions.
        acts.push(`<button class="btn" data-go="#/s/${encodeURIComponent(r.name)}/chat">${T.chat}</button>`)
        acts.push(`<button class="btn" data-tact="redraw">${T.redraw}</button>`)
        acts.push(`<button class="btn danger" data-tact="kill">${T.closeSession}</button>`)
        acts.push(`<button class="btn" data-go="${s?.archived_at ? '#/archived' : '#/'}">${s?.archived_at ? T.backArchived : T.backAll}</button>`)
        setHtml($('topRight'), acts.join(''))
        return
      }
      if (where) acts.push(`<button class="btn" data-go="#/s/${encodeURIComponent(r.name)}">${T.terminal}</button>`)
      if (reopenable(s)) acts.push(`<button class="btn primary" data-reopen="${esc(r.name)}">${T.reopen}</button>`)
      if (s) {
        acts.push(`<button class="btn" data-act="clear" data-s="${esc(s.name)}">${T.clearChat}</button>`)
        if (!s.online) acts.push(s.archived_at
          ? `<button class="btn" data-act="unarchive" data-s="${esc(s.name)}">${T.unarchive}</button>`
          : `<button class="btn" data-act="archive" data-s="${esc(s.name)}">${T.archive}</button>`)
        if (!s.online) acts.push(`<button class="btn danger" data-act="delete" data-s="${esc(s.name)}">${T.delete}</button>`)
      }
      acts.push(`<button class="btn" data-go="${s?.archived_at ? '#/archived' : '#/'}">${s?.archived_at ? T.backArchived : T.backAll}</button>`)
      setHtml($('topRight'), acts.join(''))
    }
  }

  $('topRight').addEventListener('click', e => {
    const c = e.target.closest('[data-c]')
    if (c) { cols = c.dataset.c; store.set('squadraCols', cols); applyCols(); renderTop() }
    const ro = e.target.closest('[data-reopen]')
    if (ro) return reopen(ro.dataset.reopen)
    const md = e.target.closest('[data-mode]')
    if (md) { mosaicMode = md.dataset.mode === 'chats' ? 'chats' : 'terms'; store.set('squadraMosaicMode', mosaicMode); buildMosaic(); renderTop() }
    const go = e.target.closest('[data-go]')
    if (go) location.hash = go.dataset.go
    const act = e.target.closest('[data-act]')
    if (act) runAction(act.dataset.act, act.dataset.s)
    const hact = e.target.closest('[data-hact]')
    if (hact) hostAction(hact.dataset.hact, hact.dataset.h)
    const aw = e.target.closest('[data-addworker]')
    if (aw) addWorkerTo(aw.dataset.addworker)
    const tact = e.target.closest('[data-tact]')
    if (tact) {
      const r = currentRoute()
      const st = sessionTerm(r)
      if (tact.dataset.tact === 'redraw') termView?.refresh()
      if (tact.dataset.tact === 'kill') hostAction('kill', r.host ?? st?.host.id, r.term ?? r.name)
    }
  })

  function paneHead(s) {
    const a = s.activity ?? {}
    return `<span class="dot ${status(s).dot}"></span><button class="title" data-go="#/s/${encodeURIComponent(s.name)}">${esc(s.name)}</button>${roleTag(s.role)}
      <span class="meta" title="${esc(a.cwd ?? '')}">${esc(base(a.cwd))}</span>${ctxBadge(a)}
      <button class="more" data-menu="${esc(s.name)}" title="${esc(T.actions(s.name))}" aria-label="${esc(T.actions(s.name))}">⋯</button>`
  }

  // Context gauge: tokens and % of the auto-compact point; amber from 60%, red from 80%.
  function ctxBadge(a) {
    if (!a.context_tokens) return ''
    const pct = a.context_pct == null ? null : num(a.context_pct)
    const cls = pct == null ? '' : pct >= 80 ? 'hot' : pct >= 60 ? 'warm' : ''
    const title = pct != null ? T.contextTitle(pct, kfmt(a.context_tokens), kfmt(a.compact_at ?? 0)) : T.context(kfmt(a.context_tokens))
    return `<span class="ctx ${cls}" title="${esc(title)}">${esc(kfmt(a.context_tokens))}${pct != null ? ` · ${esc(pct)}%` : ' tok'}</span>`
  }

  function paneClass(s) {
    const st = status(s)
    return `pane ${s.role ?? ''} ${st.waiting ? 'attention' : ''} ${s.online ? '' : 'offline'}`
  }

  function applyCols() {
    const box = $('mosaic')
    box.classList.toggle('fixed', cols !== 'auto')
    if (cols !== 'auto') box.style.setProperty('--cols', cols)
  }

  // A heading row per squad (all-sessions mosaic only), reused across rebuilds.
  const squadRows = new Map() // key -> element
  function squadRow(key, coord, workers) {
    let el = squadRows.get(key)
    if (!el) { el = document.createElement('div'); squadRows.set(key, el) }
    if (!coord) {
      el.className = 'squad-row orphans'
      el.innerHTML = `<span class="n">${key === 'solos' ? T.standalone : T.noCoordinator}</span>`
      return el
    }
    const on = workers.filter(w => w.online).length
    el.className = 'squad-row'
    // Rewritten only when something changed, so a click on its buttons is never lost.
    const html = `<span class="dot ${status(coord).dot}"></span><span class="n">👥 ${esc(T.squadOf(coord.name))}</span><span class="m">${esc(T.squadCount(on, workers.length))}</span>
      <span class="acts"><button class="btn" data-go="#/q/${encodeURIComponent(coord.name)}" title="${esc(T.viewSquadTitle(coord.name))}">${T.viewSquad}</button><button class="btn" data-addworker="${esc(coord.name)}" title="${esc(T.addWorkerTo(coord.name))}">${T.addWorker}</button></span>`
    if (el.dataset.html !== html) { el.innerHTML = html; el.dataset.html = html }
    return el
  }

  function buildMosaic() {
    const box = $('mosaic')
    const r = currentRoute()
    // The coordinators view: each coordinator's terminal and its team.
    const leads = r.view === 'leads'
    const key = `${leads ? 'leads' : r.squad ? `q:${r.squad}` : 'all'}:${mosaicMode}`
    if (mosaicKey !== key) { clearMosaic(); mosaicKey = key }
    box.classList.toggle('terms', leads || mosaicMode === 'terms')
    box.classList.toggle('leads', leads)
    applyCols()
    const squad = r.squad
    const all = sortedSessions()
    const list = leads ? all.filter(s => s.role === 'coordinator') : squad ? all.filter(s => s.name === squad || (s.role !== 'coordinator' && s.coordinator === squad)) : all
    // The order on screen: in the full mosaic, each squad under its heading row.
    const order = []
    if (squad || leads) order.push(...list.map(s => ({ s })))
    else {
      const { squads, orphans, solos } = squadsOf(all)
      for (const q of squads) order.push({ row: squadRow(`q:${q.coord.name}`, q.coord, q.workers) }, { s: q.coord }, ...q.workers.map(s => ({ s })))
      if (orphans.length) order.push(...(squads.length ? [{ row: squadRow('orphans') }] : []), ...orphans.map(s => ({ s })))
      if (solos.length) order.push({ row: squadRow('solos') }, ...solos.map(s => ({ s })))
    }
    const rowsUsed = new Set(order.filter(o => o.row).map(o => o.row))
    for (const [k, el] of squadRows) if (!rowsUsed.has(el)) { el.remove(); squadRows.delete(k) }
    // keep existing panes (and their scroll/history), add new, drop deleted
    const visible = new Set(list.map(s => s.name))
    for (const [name, p] of mosaicPanes) if (!visible.has(name)) { p.view.destroy(); p.pane.remove(); mosaicPanes.delete(name) }
    if (!list.length) {
      const arch = sortedSessions({ archived: true }).length
      box.innerHTML = `<div class="mosaic-empty">${leads ? T.leadsEmpty : squad ? esc(T.squadEmpty(squad)) : T.mosaicEmpty(arch)}</div>`
      squadRows.clear()
      return
    }
    box.querySelector('.mosaic-empty')?.remove()
    // Moving a node in the DOM resets its scroll: remember where each chat was.
    const scroll = new Map([...mosaicPanes].filter(([, p]) => p.kind === 'chat').map(([n, p]) => [n, { bottom: p.view.atBottom(), top: p.view.scrollEl.scrollTop }]))
    let prev = null
    for (const { s, row } of order) {
      if (row) {
        const expected = prev ? prev.nextSibling : box.firstChild
        if (expected !== row) box.insertBefore(row, expected)
        prev = row
        continue
      }
      let p = mosaicPanes.get(s.name)
      // Its live terminal (sessions opened on a machine from here), or its chat.
      const term = leads || mosaicMode === 'terms' ? terminalOf(s.name) : null
      const kind = term ? 'term' : 'chat'
      if (p && p.kind !== kind) { p.view.destroy(); p.pane.remove(); mosaicPanes.delete(s.name); p = null }
      if (!p) {
        const pane = document.createElement('section')
        pane.innerHTML = `<div class="pane-head"></div>`
        let view
        if (term) {
          const body = document.createElement('div')
          body.className = 'pane-term'
          pane.appendChild(body)
          view = new TermView(term.host.id, s.name, body, { compact: true })
        } else {
          view = new ChatView(s.name)
          pane.appendChild(view.el)
        }
        if (leads) { const team = document.createElement('div'); team.className = 'team'; pane.appendChild(team) }
        p = { pane, view, kind }
        mosaicPanes.set(s.name, p)
      }
      p.pane.className = paneClass(s)
      setHtml(p.pane.querySelector('.pane-head'), paneHead(s))
      if (leads) setHtml(p.pane.querySelector('.team'), teamStrip(s))
      // Only move panes that are out of order.
      const expected = prev ? prev.nextSibling : box.firstChild
      if (expected !== p.pane) box.insertBefore(p.pane, expected)
      prev = p.pane
    }
    for (const [n, st] of scroll) {
      const p = mosaicPanes.get(n)
      if (!p) continue
      if (st.bottom) p.view.toBottom(); else p.view.scrollEl.scrollTop = st.top
    }
  }

  // Counts and dots in the squad headings, without rebuilding the mosaic.
  function refreshSquadRows() {
    if (!squadRows.size) return
    const { squads } = squadsOf(sortedSessions())
    for (const q of squads) if (squadRows.has(`q:${q.coord.name}`)) squadRow(`q:${q.coord.name}`, q.coord, q.workers)
  }

  $('mosaic').addEventListener('click', e => {
    const gw = e.target.closest('[data-givework]')
    if (gw) return giveWork(gw.dataset.givework)
    const aw = e.target.closest('[data-addworker]')
    if (aw) return addWorkerTo(aw.dataset.addworker)
    const m = e.target.closest('[data-menu]')
    if (m) return openMenu(m, m.dataset.menu)
    const b = e.target.closest('[data-go]')
    if (b) location.hash = b.dataset.go
  })

  // ---------------------------------------------------------------------------
  // actions: clear chat, archive / unarchive, delete
  let menuEl = null
  function closeMenu() { menuEl?.remove(); menuEl = null }
  document.addEventListener('click', e => { if (menuEl && !e.target.closest('.menu') && !e.target.closest('[data-menu], [data-hmenu]')) closeMenu() })
  document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeMenu(); document.querySelector('.modal-bg')?.querySelector('[data-cancel]')?.click() } })

  function openMenu(anchor, name) {
    closeMenu()
    const s = sessions.get(name)
    if (!s) return
    const off = s.online
    menuEl = document.createElement('div')
    menuEl.className = 'menu'
    const where = terminalOf(name)
    menuEl.innerHTML = `
 ${reopenable(s) ? `<button data-act="reopen">${T.reopen}</button>` : ''}
      <button data-go="#/s/${encodeURIComponent(name)}">${T.openChat}</button>
      ${where ? `<button data-go="#/t/${encodeURIComponent(where.host.id)}/${encodeURIComponent(name)}">${T.terminal}</button>` : ''}
      ${s.role === 'coordinator' ? `<button data-go="#/q/${encodeURIComponent(name)}">${T.viewSquad}</button><button data-act="addworker">${esc(T.addWorkerTo(name))}</button>` : ''}
      <button data-act="clear">${T.clearChat}</button>
      ${off ? `<button data-act="kick" class="danger">${T.kick}</button>` : ''}
      <button data-act="archive" ${off ? 'disabled' : ''}>${T.archive}</button>
      <button data-act="delete" class="danger" ${off ? 'disabled' : ''}>${T.deleteSession}</button>
      ${off ? `<div class="hint">${T.offlineHint}</div>` : ''}`
    document.body.appendChild(menuEl)
    const r = anchor.getBoundingClientRect()
    const w = menuEl.offsetWidth
    menuEl.style.top = `${Math.min(r.bottom + 4, innerHeight - menuEl.offsetHeight - 8)}px`
    menuEl.style.left = `${Math.max(8, Math.min(r.right - w, innerWidth - w - 8))}px`
    menuEl.addEventListener('click', e => {
      const b = e.target.closest('button')
      if (!b || b.disabled) return
