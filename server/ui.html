  // A dialog with arbitrary content; returns its root and a close function.
  function dialog(html, { wide = false } = {}) {
    const bg = document.createElement('div')
    bg.className = 'modal-bg'
    bg.innerHTML = `<div class="modal ${wide ? 'wide' : ''}" role="dialog" aria-modal="true">${html}</div>`
    document.body.appendChild(bg)
    const close = () => { bg.remove(); bg.onclose?.() }
    bg.addEventListener('click', e => { if (e.target === bg || e.target.closest('[data-cancel]')) close() })
    return { el: bg, close }
  }

  function hostAction(action, id, term) {
    const h = hosts.get(id)
    if (action === 'add') return addMachineDialog()
    if (action === 'new') return newSessionDialog(id)
    if (action === 'rename' && h) {
      const d = dialog(`<h3>${T.renameTitle}</h3><label class="field"><span>${T.name}</span><input type="text" maxlength="40" value="${esc(h.name)}"></label><div class="err" style="color:var(--err);font-size:13px;min-height:1.2em"></div>
        <div class="actions"><button class="btn" data-cancel>${T.cancel}</button><button class="btn primary" data-ok>${T.save}</button></div>`)
      const input = d.el.querySelector('input')
      input.focus(); input.select()
      const save = async () => {
        try { await postJson('/api/hosts/rename', { host: id, name: input.value }); d.close() } catch (err) { d.el.querySelector('.err').textContent = err.message }
      }
      d.el.querySelector('[data-ok]').addEventListener('click', save)
      input.addEventListener('keydown', e => { if (e.key === 'Enter') save() })
      return
    }
    if (action === 'disconnect' && h) {
      return confirmDialog({ title: T.disconnectTitle(h.name), text: T.disconnectText(esc(h.name)), confirm: T.disconnect, danger: true, run: () => postJson('/api/hosts/remove', { host: id }) })
    }
    if (action === 'kill') {
      return confirmDialog({
        title: T.closeSessionTitle(term), text: T.closeSessionText(esc(term), esc(h?.name ?? id)), confirm: T.closeSession, danger: true,
        run: async () => {
          await postJson('/api/terminals/kill', { host: id, term })
          if (currentRoute().view === 'terminal') location.hash = '#/hosts'
        },
      })
    }
  }

  function addMachineDialog() {
    const d = dialog(`<h3>${T.addTitle}</h3><p>${T.addIntro}</p>
      <div data-step="1">
        <label class="field"><span>${T.machineName}</span><input type="text" maxlength="40" placeholder="${esc(T.machineNameHint)}"></label>
        <label class="check"><input type="checkbox"> <span>${T.configurePlugin}</span></label>
        <div class="err" style="color:var(--err);font-size:13px;min-height:1.2em"></div>
        <div class="actions"><button class="btn" data-cancel>${T.cancel}</button><button class="btn primary" data-gen>${T.generate}</button></div>
      </div>
      <div data-step="2" hidden>
        <p style="margin-bottom:8px">${T.stepsIntro}</p>
        <ol class="steps"></ol>
        <div class="wait"><span class="dot info pulse"></span><span class="w">${T.waitingMachine}</span></div>
        <div class="actions"><button class="btn" data-cancel>${T.done}</button><button class="btn primary" data-newsession hidden>${T.newSession}</button></div>
      </div>`, { wide: true })
    const input = d.el.querySelector('input[type=text]')
    input.focus()
    let joined = null
    let ticket = null // this dialog's code: only the machine that used it counts
    const listener = h => {
      if (h.removed || !h.online || !ticket || h.enrollment !== ticket) return
      joined = h
      d.el.querySelector('.wait').innerHTML = `<span class="dot ok"></span><span>${T.machineJoined(esc(h.name))}</span>`
      d.el.querySelector('[data-newsession]').hidden = false
    }
    d.el.onclose = () => hostListeners.delete(listener)
    d.el.querySelector('[data-gen]').addEventListener('click', async e => {
      e.target.disabled = true
      try {
        const r = await postJson('/api/hosts/enroll', { name: input.value.trim(), configure_plugin: d.el.querySelector('input[type=checkbox]').checked })
        ticket = r.enrollment ?? null
        d.el.querySelector('[data-step="1"]').hidden = true
        d.el.querySelector('[data-step="2"]').hidden = false
        // The steps, each command with its own copy button.
        const host = '~/.config/squadra-host/squadra-host.mjs'
        const cmd = (text, label = '') => `${label ? `<div class="lbl">${label}</div>` : ''}<div class="cmdrow"><pre class="cmd">${esc(text)}</pre><button class="btn" data-copy>${T.copy}</button></div>`
        const insecure = /^http:\/\//.test(r.server_url) && !/^http:\/\/(localhost|127\.0\.0\.1|\[::1\])(:|\/|$)/.test(r.server_url)
        d.el.querySelector('.steps').innerHTML = [
          `<p>${T.stepNeeds}</p>${cmd('curl -fsSL https://claude.ai/install.sh | bash', T.lblClaude)}${cmd('sudo apt install tmux', T.lblTmuxLinux)}${cmd('brew install tmux', T.lblTmuxMac)}`,
          `<p>${T.stepPlugin}</p>${cmd(String(r.plugin_command ?? ''))}`,
          `<p>${T.stepEnroll}</p>${cmd(String(r.command ?? ''))}${insecure ? `<p class="note" style="color:var(--err);font-size:13px">${esc(T.httpWarn)}</p>` : ''}<p class="note valid">${esc(T.codeValid(hhmm(r.expires_at)))}</p>`,
          `<p>${T.stepFolders}</p>${cmd(`node ${host} folders add ${T.exampleFolder}`)}`,
          `<p>${T.stepService}</p>${cmd(`mkdir -p ~/.config/systemd/user\nnode ${host} service > ~/.config/systemd/user/squadra-host.service\nsystemctl --user daemon-reload && systemctl --user enable --now squadra-host`, T.lblLinux)}${cmd(`node ${host} service > ~/Library/LaunchAgents/com.squadra.host.plist\nlaunchctl bootstrap gui/$(id -u) ~/Library/LaunchAgents/com.squadra.host.plist`, T.lblMac)}<p class="note">${T.lingerNote}</p>`,
        ].map(x => `<li>${x}</li>`).join('')
        hostListeners.add(listener)
        d.el.querySelector('.steps').addEventListener('click', async ev => {
          const b = ev.target.closest('[data-copy]')
          if (!b) return
          const pre = b.parentElement.querySelector('.cmd')
          try { await navigator.clipboard.writeText(pre.textContent); b.textContent = T.copied } catch {
            const range = document.createRange(); range.selectNodeContents(pre)
            getSelection().removeAllRanges(); getSelection().addRange(range)
          }
        })
        d.el.querySelector('[data-newsession]').addEventListener('click', () => { d.close(); location.hash = '#/hosts'; newSessionDialog(joined?.id) })
      } catch (err) {
        d.el.querySelector('.err').textContent = err.message
        e.target.disabled = false
      }
    })
  }

  // A worker for this coordinator's squad, by default on the coordinator's machine.
  function addWorkerTo(coord) {
    newSessionDialog(terminalOf(coord)?.host.id, { coordinator: coord })
  }

  function newSessionDialog(hostId, preset = {}) {
    const online = [...hosts.values()].filter(h => h.online)
    if (!online.length) return alertBox(T.noOnlineMachines)
    // Coordinators to suggest. A session declares its role itself, so only
    // one opened from the dashboard (host_id) is pre-filled; any other one
    // must be typed or picked on purpose.
    const coords = [...sessions.values()].filter(s => s.role === 'coordinator' && !s.deleted).map(s => s.name)
    const ownCoords = [...sessions.values()].filter(s => s.opened_role === 'coordinator' && s.role === 'coordinator' && s.host_id && !s.deleted).map(s => s.name)
    const hasCoord = !!preset.coordinator || ownCoords.length > 0
    const d = dialog(`<h3>${preset.coordinator ? esc(T.addWorkerTo(preset.coordinator)) : T.newSessionTitle}</h3>
      <label class="field"><span>${T.machine}</span><select name="host">${online.map(h => `<option value="${esc(h.id)}" ${h.id === hostId ? 'selected' : ''}>${esc(h.name)}</option>`).join('')}</select></label>
      <div class="row2">
        <label class="field"><span>${T.role}</span><select name="role"><option value="worker" ${hasCoord ? 'selected' : ''}>${T.roleWorker}</option><option value="coordinator" ${hasCoord ? '' : 'selected'}>${T.roleCoordinator}</option></select></label>
        <label class="field"><span>${T.sessionName}</span><input type="text" name="name" maxlength="32" pattern="[A-Za-z0-9_-]{1,32}" autocomplete="off"></label>
      </div>
      <label class="field" data-only="worker"><span>${T.coordinatorName}</span><input type="text" name="coordinator" list="coordList" maxlength="32" value="${esc(preset.coordinator ?? (ownCoords.length === 1 ? ownCoords[0] : ''))}"><datalist id="coordList">${coords.map(c => `<option value="${esc(c)}" label="${esc(ownCoords.includes(c) ? T.coordOwn : T.coordSelf)}">`).join('')}</datalist></label>
      <div class="row2">
        <label class="field"><span>${T.folder}</span><select name="folder"></select></label>
        <label class="field"><span>${T.subfolder}</span><input type="text" name="sub" placeholder="${esc(T.subfolderHint)}" autocomplete="off"></label>
      </div>
      <label class="field"><span>${T.compact}</span><select name="compact">
        <option value="600000" selected>${T.compactRec}</option>
        <option value="">${T.compactDefault}</option>
        ${[300, 400, 500, 700, 800].map(k => `<option value="${k * 1000}">${T.compactK(k)}</option>`).join('')}
      </select><span class="hint">${T.compactHint}</span></label>
      <label class="check"><input type="checkbox" name="resume"> <span>${T.resume}</span></label>
      <div class="err" style="color:var(--err);font-size:13px;min-height:1.2em"></div>
      <div class="actions"><button class="btn" data-cancel>${T.cancel}</button><button class="btn primary" data-ok>${T.open}</button></div>`, { wide: true })
    const f = name => d.el.querySelector(`[name=${name}]`)
    const suggestName = () => {
      if (f('role').value === 'coordinator') return sessions.has('coord') && sessions.get('coord').online ? '' : 'coord'
      for (let i = 1; ; i++) if (!sessions.get(`worker${i}`)?.online && !terminalOf(`worker${i}`)) return `worker${i}`
    }
    // A coordinator that wasn't opened from this dashboard is only a name a
    // session gave itself: said right next to the field.
    const coordHint = document.createElement('div')
    coordHint.style.cssText = 'color:var(--err);font-size:12px;min-height:1em'
    f('coordinator').after(coordHint)
    const checkCoord = () => {
      const v = f('coordinator').value.trim()
      const s = v && !ownCoords.includes(v) ? sessions.get(v) : null
      coordHint.textContent = !v || ownCoords.includes(v) ? '' : `⚠ ${s && !s.deleted ? (s.role === 'coordinator' ? T.coordSelf : T.coordNotCoord) : T.coordNone}`
    }
    f('coordinator').addEventListener('input', checkCoord)
    checkCoord()
    const sync = () => {
      d.el.querySelector('[data-only=worker]').hidden = f('role').value !== 'worker'
      const h = hosts.get(f('host').value)
      const folders = h?.info?.folders ?? []
      f('folder').innerHTML = folders.length ? folders.map(x => `<option value="${esc(x)}">${esc(x)}</option>`).join('') : `<option value="">—</option>`
    }
    f('role').addEventListener('change', () => { f('name').value = suggestName(); sync() })
    f('host').addEventListener('change', sync)
    f('name').value = suggestName()
    sync()
    f('name').focus()
    const ok = d.el.querySelector('[data-ok]')
    ok.addEventListener('click', async () => {
      const err = d.el.querySelector('.err')
      err.textContent = ''
      const host = f('host').value
      const base = f('folder').value
      const sub = f('sub').value.trim().replace(/^\/+|\/+$/g, '')
      const spec = {
        name: f('name').value.trim(),
        role: f('role').value,
        folder: sub ? `${base.replace(/\/+$/, '')}/${sub}` : base,
        resume: f('resume').checked,
      }
      if (spec.role === 'worker') {
        // A worker's coordinator is always chosen, never assumed: a session
        // can call itself "coord" without being yours.
        spec.coordinator = f('coordinator').value.trim()
        if (!/^[A-Za-z0-9_-]{1,32}$/.test(spec.coordinator)) { err.textContent = T.coordinatorName + ': A-Z a-z 0-9 _ -'; f('coordinator').focus(); return }
      }
      if (f('compact').value) spec.compact_window = Number(f('compact').value)
      if (!/^[A-Za-z0-9_-]{1,32}$/.test(spec.name)) { err.textContent = T.sessionName + ': A-Z a-z 0-9 _ -'; f('name').focus(); return }
      ok.disabled = true
      ok.textContent = T.opening
      try {
        await postJson('/api/terminals/open', { host, spec })
        d.close()
        location.hash = `#/t/${encodeURIComponent(host)}/${encodeURIComponent(spec.name)}`
      } catch (e) {
        err.textContent = e.message
        ok.disabled = false
        ok.textContent = T.open
      }
    })
  }

  // ---------------------------------------------------------------------------
  // web terminal: xterm.js (loaded on first use) over one WebSocket per tab
  let xtermReady = null
  function loadXterm() {
    if (xtermReady) return xtermReady
    // Served by squadra-server itself (vendor/): no third-party scripts.
    const css = document.createElement('link')
    css.rel = 'stylesheet'
    css.href = '/vendor/xterm.css'
    document.head.appendChild(css)
    const script = src => new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s) })
    xtermReady = script('/vendor/xterm.js').then(() => script('/vendor/addon-fit.js'))
    xtermReady.catch(() => { xtermReady = null })
    return xtermReady
  }

  const b64bytes = b => Uint8Array.from(atob(b), c => c.charCodeAt(0))

  const termLink = {
    ws: null, ready: false, views: new Set(), backoff: 1000, timer: null,
    retry() {
      for (const v of this.views) v.overlay(T.termLinkDown)
      if (this.views.size) { clearTimeout(this.timer); this.timer = setTimeout(() => this.ensure(), this.backoff); this.backoff = Math.min(this.backoff * 2, 15000) }
    },
    ensure() {
      if (this.ws || this.connecting || !token) return
      // A one-time ticket (the token itself never goes in the socket request):
      // the server only accepts the socket with it.
      this.connecting = true
      postJson('/api/terminal/ticket', {}).then(({ ticket }) => {
        this.connecting = false
        if (!this.ws && this.views.size) this.open(ticket)
      }, () => { this.connecting = false; if (token) this.retry() })
    },
    open(ticket) {
      const ws = this.ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/api/terminal`, ['squadra', `auth.${ticket}`])
      ws.onmessage = ev => {
        let m
        try { m = JSON.parse(ev.data) } catch { return }
        if (m.t === 'ready') { this.ready = true; this.backoff = 1000; for (const v of this.views) v.attach(); return }
        for (const v of this.views) if (v.host === m.host && v.term === m.term) v.onMessage(m)
      }
      ws.onclose = ev => {
        if (this.ws !== ws) return
        this.ws = null
        this.ready = false
        this.retry()
      }
    },
    send(m) { if (this.ready && this.ws?.readyState === 1) this.ws.send(JSON.stringify(m)) },
    add(v) { this.views.add(v); this.ensure(); if (this.ready) v.attach() },
    remove(v) { this.send({ t: 'detach', host: v.host, term: v.term }); this.views.delete(v) },
    close() { clearTimeout(this.timer); const ws = this.ws; this.ws = null; this.ready = false; this.views.clear(); ws?.close() },
  }

  let termView = null
  class TermView {
    constructor(host, term, root) {
      this.host = host
      this.term = term
      this.dead = false
      root.innerHTML = `<div class="term-box"><div class="term-over">${T.termLoading}</div></div><div class="term-foot"></div>`
      this.box = root.querySelector('.term-box')
      this.over = root.querySelector('.term-over')
      this.foot = root.querySelector('.term-foot')
      this.renderFoot()
      loadXterm().then(() => { if (!this.dead) this.start() }, () => this.overlay(T.termLoadFailed))
    }

    renderFoot() {
      const h = hosts.get(this.host)
      const ro = h?.info?.allow_input === false
      this.foot.innerHTML = (ro ? `<span class="ro">👁 ${T.readOnly}</span><span>${esc(T.typingOff)}</span>` : `<span>${esc(T.termHint(h?.name ?? this.host))}</span>`) +
        (this.notice ? `<span class="ro">⚠ ${T.machineSays}: ${esc(this.notice)}</span>` : '')
    }

    start() {
      const dark = { background: '#161513', foreground: '#ecebe7', cursor: '#e0855f', selectionBackground: '#4a4740' }
      this.x = new window.Terminal({
        fontFamily: 'ui-monospace, SFMono-Regular, Menlo, Consolas, monospace', fontSize: 13.5, cursorBlink: true, scrollback: 5000, theme: dark, allowProposedApi: false,
        // Links printed by the program (OSC 8): only http(s), after a confirmation, in a new tab.
        // Only plain http(s) links, shown as they are (no user:password@, no
        // control or direction characters that could make it read otherwise).
        linkHandler: { activate: (e, uri) => {
          let u
          try { u = new URL(uri) } catch { return }
          if (!/^https?:$/.test(u.protocol) || u.username || u.password || /[\u0000-\u001f\u007f-\u009f\u200b-\u200f\u202a-\u202e\u2066-\u2069]/.test(uri)) return
          if (confirm(`${T.openLink}\n${u.href}`)) window.open(u.href, '_blank', 'noopener,noreferrer')
        } },
      })
      this.fit = new window.FitAddon.FitAddon()
      this.x.loadAddon(this.fit)
      this.x.open(this.box)
      this.fitNow()
      // What xterm.js answers by itself to a program's queries (device
      // attributes, cursor position, modes, focus) isn't sent: tmux already
      // answers them, and every dashboard watching would type them in again.
      // (Unless a key was just pressed: Shift+F3 also looks like a report.)
      let keyAt = 0
      this.box.addEventListener('keydown', () => { keyAt = performance.now() }, true)
      const REPORT = /^(?:\x1b\[[?>=]?[\d;]*c|\x1b\[\??\d+;\d+R|\x1b\[\??[\d;]*\$y|\x1bP[01]\$r[^\x1b]*\x1b\\|\x1b\[[IO]|\x1b\[[\d;]*t|\x1b\][\d;]*rgb:[^\x07\x1b]*(?:\x07|\x1b\\))+$/
      this.x.onData(data => {
        if (hosts.get(this.host)?.info?.allow_input === false) return
        if (REPORT.test(data) && performance.now() - keyAt > 100) return
        termLink.send({ t: 'in', host: this.host, term: this.term, data })
      })
      // Pasted text can't carry escape sequences (they could end bracketed
      // paste and run what follows): control and bidi characters are dropped.
      this.box.addEventListener('paste', e => {
        const text = e.clipboardData?.getData('text') ?? ''
        const clean = text.replace(/[\u0000-\u0008\u000b-\u001f\u007f-\u009f\u00ad\u034f\u061c\u180e\u200b-\u200f\u2028\u2029\u202a-\u202e\u2060-\u2064\u2066-\u2069\u115f\u1160\u17b4\u17b5\u2065\u2800\u3164\uffa0\ufeff\ufff9-\ufffb\u{1d173}-\u{1d17a}\u{e0000}-\u{e007f}\u180b-\u180f\ufe00-\ufe0f\u{e0100}-\u{e01ef}\p{Cf}]/gu, '')
        if (clean !== text) { e.preventDefault(); e.stopPropagation(); this.x.paste(clean) }
      }, true)
      let resizeTimer = null
      this.x.onResize(({ cols, rows }) => {
        clearTimeout(resizeTimer)
        resizeTimer = setTimeout(() => termLink.send({ t: 'resize', host: this.host, term: this.term, cols, rows }), 150)
      })
      this.ro = new ResizeObserver(() => this.fitNow())
      this.ro.observe(this.box)
      // Not when the page was opened straight on this terminal (e.g. from a
      // link): typing goes to a machine only after the user chose it here.
      if (navigatedInApp) this.x.focus()
      termLink.add(this)
    }

    fitNow() { try { this.fit?.fit() } catch {} }

    attach() {
      if (!this.x) return
      this.overlay(null)
      termLink.send({ t: 'attach', host: this.host, term: this.term, cols: this.x.cols, rows: this.x.rows })
    }

    refresh() { termLink.send({ t: 'refresh', host: this.host, term: this.term }) }

    overlay(text) {
      this.over.hidden = !text
      if (text) this.over.textContent = text
    }

    onMessage(m) {
      if (m.t === 'screen') { this.x.reset(); this.x.write(b64bytes(m.data)); this.overlay(null); return }
      if (m.t === 'out') { this.x.write(b64bytes(m.data)); return }
      if (m.t === 'exit') return this.overlay(T.termEnded)
      if (m.t === 'host_down') return this.overlay(T.termHostDown)
      // What the machine says goes next to the footer, never in place of it:
      // the read-only state shown always comes from the machine's settings.
      if (m.t === 'notice') { this.notice = String(m.text ?? '').slice(0, 300); this.renderFoot() }
    }

    destroy() {
      this.dead = true
      this.ro?.disconnect()
      if (this.x) termLink.remove(this)
      this.x?.dispose()
    }
  }

  // A machine that comes back: re-attach the terminal on screen.
  hostListeners.add(h => {
    if (termView && termView.host === h.id) {
      termView.renderFoot()
      if (h.online && !termView.over.hidden && termView.over.textContent === T.termHostDown) termView.attach()
    }
  })

  // ---------------------------------------------------------------------------
  // live stream
  function onStream(type, data) {
    if (type === 'hello') {
      serverSkew = data.server_time - Date.now()
      if (data.version) setVersion(data.version)
      sessions.clear()
      for (const s of data.sessions) sessions.set(s.name, s)
      groups = data.groups ?? []
      hosts.clear()
      for (const h of data.hosts ?? []) hosts.set(h.id, h)
      // After a reconnect, what happened in between isn't in the open chats:
      // they load again from the server.
      if (streamHelloSeen) for (const v of views) v.reset()
      streamHelloSeen = true
      route()
      return
    }
    if (type === 'host') {
      if (data.removed) hosts.delete(data.id); else hosts.set(data.id, data)
      for (const fn of hostListeners) fn(data)
      const r = currentRoute()
      if (r.view === 'hosts') { if (r.host && data.removed && data.id === r.host) { location.hash = '#/hosts'; return } renderHosts(r.host); soon(renderTop) }
      if (r.view === 'terminal' || r.view === 'session') soon(renderTop)
      if (r.view === 'mosaic') for (const [name, p] of mosaicPanes) { const s = sessions.get(name); if (s) setHtml(p.pane.querySelector('.pane-head'), paneHead(s)) }
      soon(renderNav)
      return
    }
    if (type === 'session') {
      const prev = sessions.get(data.name)
      if (data.deleted) { sessions.delete(data.name); unread.delete(data.name) } else sessions.set(data.name, data)
      const r = currentRoute()
      if (r.view === 'mosaic') {
        if (!prev || data.deleted || !!prev.archived_at !== !!data.archived_at || prev.role !== data.role || prev.coordinator !== data.coordinator) buildMosaic()
        else { const p = mosaicPanes.get(data.name); if (p) { p.pane.className = paneClass(data); setHtml(p.pane.querySelector('.pane-head'), paneHead(data)) } soon(refreshSquadRows) }
      }
      if (r.view === 'archived') renderArchived()
      if (r.view === 'session' && r.name === data.name && data.deleted) { location.hash = '#/'; return }
      for (const v of views) if (v.name === data.name) { v.renderStatus(); v.scheduleRender() }
      soon(renderNav)
      // The top bar shows one session (or one squad): only its changes matter.
      if ((r.view === 'session' && r.name === data.name) || r.view === 'terminal' || r.squad) soon(renderTop)
      return
    }
    if (type === 'cleared') {
      const s = sessions.get(data.session)
      if (s) s.cleared_at = data.at
      for (const v of views) if (v.name === data.session) v.reset()
      unread.delete(data.session)
      soon(renderNav)
      return
    }
    if (type === 'edited') {
      // An edited message: the new text replaces the old one where it is shown.
      for (const v of views) {
        const i = v.items.findIndex(x => x.t === 'message' && x.id === data.id)
        if (i >= 0) { v.items[i] = { ...v.items[i], text: data.text, edited_at: data.edited_at }; v.scheduleRender() }
      }
      return
    }
    if (type === 'event' || type === 'message') {
      const it = type === 'event' ? { ...data, t: 'event' } : { ...data, t: 'message', ts: data.created_at }
      if (it.t === 'event' && it.kind === 'usage') return
      let shown = false
      for (const v of views) if (v.live(it)) shown = true
      // unread counters for sessions not on screen
      const r = currentRoute()
      if (r.view === 'session') {
        const owners = it.t === 'event' ? [it.session] : [it.from, it.target].filter(n => sessions.has(n))
        let changed = false
        for (const n of owners) if (n !== r.name) { unread.set(n, (unread.get(n) ?? 0) + 1); changed = true }
        if (changed) soon(renderNav)
      }
      void shown
    }
  }

  function setConn(cls, text) { $('connDot').className = `dot ${cls}`; $('connText').textContent = text }

  // Each sign-in has its own stream loop: an older one (waiting to reconnect
  // when the admin logged out) stops instead of opening a second stream.
  let streamGen = 0
  async function connect() {
    const gen = ++streamGen
    let backoff = 1000
    for (;;) {
      if (gen !== streamGen) return
      streamAbort = new AbortController()
      try {
        const r = await fetch('/api/stream', { headers: { Authorization: `Bearer ${token}` }, signal: streamAbort.signal })
        if (r.status === 401) return showLogin(T.tokenInvalid)
        if (!r.ok || !r.body) throw new Error(`HTTP ${r.status}`)
        setConn('ok', T.live)
        backoff = 1000
        const reader = r.body.getReader()
        const dec = new TextDecoder()
        let buf = ''
        for (;;) {
          const { value, done } = await reader.read()
          if (done) break
          buf += dec.decode(value, { stream: true })
          let i
          while ((i = buf.indexOf('\n\n')) >= 0) {
            const block = buf.slice(0, i); buf = buf.slice(i + 2)
            let type = 'message', data = ''
            for (const line of block.split('\n')) {
              if (line.startsWith('event: ')) type = line.slice(7)
              else if (line.startsWith('data: ')) data += line.slice(6)
            }
            if (data) { try { onStream(type, JSON.parse(data)) } catch (e) { console.error(e) } }
          }
        }
      } catch (e) {
        if (e.name === 'AbortError') return
      }
      if (gen !== streamGen) return
      setConn('err', T.reconnecting)
      await new Promise(res => setTimeout(res, backoff))
      backoff = Math.min(backoff * 2, 15000)
    }
  }

  // What needs you, across every session: permissions and nearly-full contexts.
  function renderAlerts() {
    const box = $('alerts')
    if (!box) return
    // Sessions opened from the dashboard (host_id) first: a flood from other
    // sessions can't push them out of view.
    const list = sortedSessions().filter(s => s.online).sort((a, b) => !!b.host_id - !!a.host_id)
    const items = []
    for (const s of list) {
      const st = status(s)
      if (st.waiting) {
        const a = s.activity ?? {}
        const what = a.tool ? `${toolName(a.tool.name)}${a.tool.summary ? ` · ${a.tool.summary}` : ''}` : a.waiting
        items.push({ cls: '', name: s.name, html: T.alertPerm(esc(s.name), esc(what ?? '')) })
      }
    }
    for (const s of list) {
      const p = s.activity?.context_pct
      if (p != null && p >= 80) items.push({ cls: 'ctxw', name: s.name, html: T.alertCtx(esc(s.name), p) })
    }
    const key = items.map(i => i.html).join('|')
    if (box.dataset.key === key) return
    box.dataset.key = key
    box.hidden = !items.length
    const shown = items.slice(0, 4)
    box.innerHTML = items.length ? `<span class="lbl">${T.needsYou}</span>${shown.map(i => `<button class="alert ${i.cls}" data-go="#/s/${encodeURIComponent(i.name)}">${i.html}</button>`).join('')}${items.length > shown.length ? `<span class="t">${T.alertMore(items.length - shown.length)}</span>` : ''}` : ''
  }
  $('alerts').addEventListener('click', e => {
    const b = e.target.closest('[data-go]')
    if (!b) return
    // The machine's terminal is where a permission is answered, when there is one.
    const name = dec(b.dataset.go.slice(4))
    const where = terminalOf(name)
    location.hash = where && sessions.get(name) && status(sessions.get(name)).waiting ? `#/t/${encodeURIComponent(where.host.id)}/${encodeURIComponent(name)}` : b.dataset.go
  })

  setInterval(() => {
    for (const v of views) v.tick()
    renderNav()
    renderAlerts()
    refreshSquadRows()
    const r = currentRoute()
    if (r.view === 'mosaic') for (const [name, p] of mosaicPanes) { const s = sessions.get(name); if (s) p.pane.querySelector('.pane-head .dot').className = `dot ${status(s).dot}` }
  }, 1000)

  // ---------------------------------------------------------------------------
  // login: the dashboard is only built after the server accepts the token
  function show(id) { for (const x of ['splash', 'login', 'app']) $(x).hidden = x !== id }

  // keep: the server couldn't be reached (not a wrong token): the saved token stays.
  function showLogin(err = '', { keep = false } = {}) {
    streamGen++
    streamAbort?.abort()
    // (Open dialogs go too: an enrollment command isn't left over the login page.)
    for (const m of document.querySelectorAll('.modal-bg')) { try { m.onclose?.() } catch {} ; m.remove() }
    clearMosaic()
    sessionView?.destroy(); sessionView = null
    termView?.destroy(); termView = null
    termLink.close()
    sessions.clear()
    hosts.clear()
    closeMenu()
    // (Not a token another tab has just signed in with.)
    if (!keep) { if ((store.get('squadraToken') ?? token) === token) store.del('squadraToken'); store.del('swarmToken') }
    token = null
    show('login')
    $('loginErr').textContent = err
    $('tokenInput').value = ''
    $('tokenInput').focus()
  }

  async function enter(candidate) {
    token = candidate
    await api('/api/state') // throws if the token is wrong
    store.set('squadraToken', token)
    $('tokenInput').value = ''
    show('app')
    connect()
  }

  $('loginForm').addEventListener('submit', async e => {
    e.preventDefault()
    $('loginBtn').disabled = true
    $('loginErr').textContent = ''
    try {
      await enter($('tokenInput').value.trim())
    } catch (err) {
      token = null
      $('loginErr').textContent = err.status === 401 ? T.tokenWrong : T.cannotConnect(err.message)
    } finally {
      $('loginBtn').disabled = false
    }
  })

  $('logoutBtn').addEventListener('click', () => showLogin())

  // static texts, version footer and language switch
  $('splash').textContent = T.connecting
  $('loginIntro').innerHTML = T.loginIntro
  $('tokenInput').placeholder = T.tokenPlaceholder
  $('loginBtn').textContent = T.enter
  $('connText').textContent = T.connecting
  $('logoutBtn').textContent = T.logout
  $('logoutBtn').title = T.logoutTitle
  $('menuBtn').setAttribute('aria-label', T.sessionsMenu)
  $('addHostBtn').title = T.addTitle
  $('addHostBtn').setAttribute('aria-label', T.addTitle)
  // The button shows the mode it switches to.
  function themeButtons() {
    const dark = themeNow() === 'dark'
    for (const b of document.querySelectorAll('[data-theme-toggle]')) {
      b.textContent = dark ? '☀️' : '🌙'
      b.title = dark ? T.lightMode : T.darkMode
      b.setAttribute('aria-label', b.title)
    }
  }
  for (const b of document.querySelectorAll('[data-theme-toggle]')) {
    b.addEventListener('click', () => {
      const next = themeNow() === 'dark' ? 'light' : 'dark'
      document.documentElement.dataset.theme = next
      store.set('squadraTheme', next)
      themeButtons()
    })
  }
  darkQuery.addEventListener('change', themeButtons)
  themeButtons()
  for (const b of document.querySelectorAll('[data-lang]')) {
    b.classList.toggle('on', b.dataset.lang === LANG)
    b.addEventListener('click', () => { store.set('squadraLang', b.dataset.lang); location.reload() })
  }
  function setVersion(v) {
    for (const el of document.querySelectorAll('.ver')) el.textContent = `Squadra v${v}`
  }
  fetch('/health').then(r => r.json()).then(j => { if (j.version) setVersion(j.version) }).catch(() => {})

  // Logged out in another tab of this browser: this one too.
  window.addEventListener('storage', e => { if (e.key === 'squadraToken' && !e.newValue && token) showLogin() })

  // boot
  if (token) {
    show('splash')
    enter(token).catch(err => err.status === 401 ? showLogin(T.storedTokenInvalid) : showLogin(T.cannotConnect(err.message), { keep: true }))
  } else {
    show('login')
    $('tokenInput').focus()
  }
})()
</script>
</body>
</html>
